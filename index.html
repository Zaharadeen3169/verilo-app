<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Verilo — Verify People. Build Trust.</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%F0%9F%9B%A1%EF%B8%8F%3C/text%3E%3C/svg%3E">
<style>
:root{--navy:#102A43;--teal:#00C2A8;--bg:#F3F6F9;--card:#fff;--tx:#102A43;--mut:#5b6f82;--ln:#dfe6ed;--bad:#c0392b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0b1c2c;--card:#142f47;--tx:#f3f6f9;--mut:#9fb3c6;--ln:#24435f}}
*{box-sizing:border-box}[hidden]{display:none!important}html{height:100%}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Plus Jakarta Sans","Segoe UI",system-ui,sans-serif;line-height:1.45}
header{background:var(--navy);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:10px}
header b{flex:1;font-size:18px}header small{opacity:.8}
header button{background:none;border:1px solid #ffffff55;color:#fff;border-radius:8px;padding:6px 10px}
nav{display:flex;gap:6px;overflow-x:auto;padding:10px 12px;background:var(--card);border-bottom:1px solid var(--ln)}
nav button,.seg button{white-space:nowrap;border:1px solid var(--ln);background:var(--card);color:var(--tx);border-radius:99px;padding:8px 14px;font-size:14px}
nav button.on,.seg button.on{background:var(--navy);color:#fff}.seg{display:flex;gap:6px;margin:10px 0}.seg button{flex:1}
main{max-width:640px;margin:0 auto;padding:14px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:14px;margin-bottom:12px}
.mut{color:var(--mut);font-size:13px}label{font-size:13px;color:var(--mut);font-weight:600;display:block;margin-top:6px}
input,textarea,select{width:100%;padding:12px;border:1px solid var(--ln);border-radius:10px;font:inherit;background:var(--card);color:var(--tx);margin:4px 0 6px}
.chk{display:flex;gap:8px;align-items:flex-start;font-weight:400}.chk input{width:auto;margin-top:3px}
button.btn{background:var(--teal);color:var(--navy);font-weight:700;border:0;border-radius:10px;padding:11px 14px;font-size:14px;margin:6px 6px 0 0}
button.alt{background:transparent;border:2px solid var(--teal);color:var(--tx)}button.red{background:var(--bad);color:#fff}
.login{max-width:400px;margin:6vh auto;padding:16px}
.row{display:flex;gap:12px;align-items:center}.av{width:48px;height:48px;border-radius:50%;background:var(--navy);color:var(--teal);display:grid;place-items:center;font-weight:800;flex:none}
.badge{font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;display:inline-block}
.b-v{background:#d9f7f1;color:#00695c}.b-r{background:#fdf0cf;color:#b7791f}.b-u{background:#e8edf2;color:#4a5d70}.b-x{background:#fbe0dc;color:#c0392b}
.bub{padding:9px 12px;border-radius:14px;margin:6px 0;max-width:80%;white-space:pre-wrap;word-break:break-word}
.bub.me{background:var(--teal);color:var(--navy);margin-left:auto}.bub.them{background:var(--bg);border:1px solid var(--ln)}
#msgs{max-height:55vh;overflow:auto}.stars{color:#e9a400}.unread{border-left:4px solid var(--teal)}
.pay{border-top:1px solid var(--ln);margin-top:8px;padding-top:6px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 16px;border-radius:10px;opacity:0;pointer-events:none;transition:.2s;max-width:90%;z-index:9}
#toast.show{opacity:1}#toast.bad{background:var(--bad)}
#modal{position:fixed;inset:0;background:#000a;display:flex;align-items:flex-end;justify-content:center;z-index:6}
#modal>div{background:var(--bg);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px}
button.sm{padding:6px 11px;font-size:13px;margin:4px 5px 0 0}.card img,.card video{max-height:70vh;object-fit:contain;background:#0002}
</style></head><body>
<section class="login" id="auth">
<h1 style="margin-bottom:0">Verilo</h1><p class="mut" style="margin-top:2px">Verify People. Build Trust.</p>
<div class="seg"><button id="mLogin" class="on">Log in</button><button id="mSign">Sign up</button></div>
<div id="signF" hidden>
<select id="role"><option value="worker">I am a worker</option><option value="employer">I am an employer</option></select>
<input id="nm" placeholder="Full name" autocomplete="name">
<input id="ph" type="tel" placeholder="Phone, e.g. 08012345678" autocomplete="tel">
<select id="stt"></select><input id="cty" placeholder="City or town">
<select id="et" hidden><option value="household">Household</option><option value="business">Business</option></select>
<label class="chk"><input type="checkbox" id="terms"> I agree to the Terms and Privacy Policy (NDPA)</label></div>
<input id="em" type="email" placeholder="Email" autocomplete="username">
<input id="pw" type="password" placeholder="Password (8 or more characters)" autocomplete="current-password">
<button class="btn" id="go" style="width:100%">Log in</button>
<p class="mut">Verification means documents were checked by an authorised admin. It does not guarantee a person’s behaviour or safety.</p></section>
<div id="app" hidden><header><b>Verilo</b><small id="who"></small><button id="out">Log out</button></header>
<nav id="tabs"></nav><main id="view"></main></div>
<div id="modal" hidden></div><div id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const sb=supabase.createClient('https://maeraxyuwiwnlujctlzt.supabase.co','sb_publishable_gLotKP2jJGgtYaGD44bcmg_3K00b_qK');
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const toast=(m,bad)=>{const t=$('toast');t.textContent=m;t.className='show'+(bad?' bad':'');setTimeout(()=>t.className='',4000)};
const guard=async fn=>{try{await fn()}catch(e){toast(e.message||String(e),true)}};
const rpc=async(n,a)=>{const{data,error}=await sb.rpc(n,a);if(error)throw error;return data};
const num=v=>v===''||v==null?null:Number(v);
const STN=["Abia","Adamawa","Akwa Ibom","Anambra","Bauchi","Bayelsa","Benue","Borno","Cross River","Delta","Ebonyi","Edo","Ekiti","Enugu","FCT (Abuja)","Gombe","Imo","Jigawa","Kaduna","Kano","Katsina","Kebbi","Kogi","Kwara","Lagos","Nasarawa","Niger","Ogun","Ondo","Osun","Oyo","Plateau","Rivers","Sokoto","Taraba","Yobe","Zamfara"];
const VL={unverified:'Unverified',under_review:'Under review',verified:'Verified',rejected:'Rejected'},VC={verified:'b-v',under_review:'b-r',unverified:'b-u',rejected:'b-x'};
const badge=s=>`<span class="badge ${VC[s]||'b-u'}">${esc(VL[s]||s)}</span>`;
const opts=(a,sel,k,n)=>a.map(x=>`<option value="${esc(x[k])}"${String(x[k])===String(sel)?' selected':''}>${esc(x[n])}</option>`).join('');
const ini=n=>String(n||'?').split(' ').map(x=>x[0]).slice(0,2).join('').toUpperCase();
const when=d=>d?new Date(d).toLocaleString('en-GB'):'';
const stars=n=>'★'.repeat(n)+'☆'.repeat(5-n);
const ngn=n=>n==null?'—':'₦'+Number(n).toLocaleString();
const BS={requested:'Requested',negotiating:'Negotiating',accepted:'Accepted',awaiting_payment:'Awaiting payment',confirmed:'Confirmed',in_progress:'In progress',completed:'Completed',cancelled:'Cancelled',disputed:'Disputed'};
const PS={reported_paid:'Reported as paid by the employer',receipt_confirmed:'Receipt confirmed by the worker',disputed:'Payment disputed',refunded:'Refunded'};
const PM={direct_transfer:'Bank transfer',direct_cash:'Cash',direct_other:'Other direct method'};
let me,W,ST=[],CT=[],mode='login',cur='',chat=null,subbed=false,BKm={};

$('stt').innerHTML='<option value="">State</option>'+STN.map(s=>`<option>${esc(s)}</option>`).join('');
$('role').onchange=()=>$('et').hidden=$('role').value!=='employer';
function setMode(m){mode=m;$('signF').hidden=m!=='sign';$('mLogin').className=m==='login'?'on':'';$('mSign').className=m==='sign'?'on':'';$('go').textContent=m==='login'?'Log in':'Create account'}
$('mLogin').onclick=()=>setMode('login');$('mSign').onclick=()=>setMode('sign');
$('go').onclick=()=>guard(async()=>{
  const email=$('em').value.trim(),password=$('pw').value;
  if(mode==='login'){const{data,error}=await sb.auth.signInWithPassword({email,password});if(error)throw error;return enter(data.user)}
  if(!$('terms').checked)throw new Error('Please accept the Terms and Privacy Policy.');
  if(!$('nm').value.trim()||!$('stt').value)throw new Error('Enter your name and choose your state.');
  const role=$('role').value;
  const{data,error}=await sb.auth.signUp({email,password,options:{data:{role,full_name:$('nm').value.trim(),phone:$('ph').value.trim(),state:$('stt').value,city:$('cty').value.trim(),employer_type:role==='employer'?$('et').value:'',accepted_terms:true}}});
  if(error){throw new Error(/Database error/i.test(error.message)?'Could not create the account. Check your phone number format (e.g. 08012345678) and try again.':error.message)}
  if(data.session)return enter(data.user);
  toast('Account created. Check your email to confirm, then log in.');setMode('login');
});
$('out').onclick=async()=>{await sb.auth.signOut();location.reload()};
sb.auth.getSession().then(({data})=>{if(data.session)guard(()=>enter(data.session.user))});

async function enter(u){
  const{data:p,error}=await sb.from('profiles').select('*').eq('id',u.id).single();if(error)throw error;
  if(p.role==='admin'){await sb.auth.signOut();throw new Error('Admins should use the admin website.')}
  if(p.status!=='active'){await sb.auth.signOut();throw new Error('This account is not active.')}
  me=p;me.email=u.email;
  const[s,c]=await Promise.all([sb.from('states').select('id,name').order('name'),sb.from('categories').select('id,slug,name').eq('active',true).order('name')]);
  ST=s.data||[];CT=c.data||[];
  $('auth').hidden=true;$('app').hidden=false;$('who').textContent=p.full_name;
  const T=TABS[p.role];$('tabs').innerHTML=T.map(t=>`<button data-t="${t[0]}">${t[1]}</button>`).join('');go(T[0][0]);
  if(!subbed){subbed=true;sb.channel('rt-'+me.id)
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'notifications',filter:'user_id=eq.'+me.id},x=>{toast(x.new.title+(x.new.body?': '+x.new.body:''));refreshBadge();if(cur==='nt')guard(notifs)})
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'messages'},x=>addMsg(x.new)).subscribe()}
}
const TABS={worker:[['wp','My profile'],['wv','Verification'],['bk','Bookings'],['ms','Messages'],['nt','Alerts'],['rv','My reviews'],['st','Settings']],employer:[['ef','Find workers'],['bk','Bookings'],['ms','Messages'],['nt','Alerts'],['st','Settings']]};
const R={wp:wProfile,wv:wVerify,bk:bookings,ef:eFind,ms:msgs,nt:notifs,rv:wReviews,st:settings};
function hl(t){cur=t;document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===t))}
function go(t){hl(t);chat=null;$('view').innerHTML='<p class="mut">Loading…</p>';guard(R[t]);refreshBadge()}
$('tabs').onclick=e=>{const b=e.target.closest('button');if(b)go(b.dataset.t)};
async function refreshBadge(){const{count}=await sb.from('notifications').select('id',{count:'exact',head:true}).eq('user_id',me.id).is('read_at',null);const b=document.querySelector('#tabs [data-t=nt]');if(b)b.textContent='Alerts'+(count?` (${count})`:'')}
async function loadW(){const{data,error}=await sb.from('worker_profiles').select('*').eq('user_id',me.id).maybeSingle();if(error)throw error;W=data}

/* ---------- WORKER PROFILE & VERIFICATION ---------- */
async function fillL(sid,sel){const el=$('pl');if(!sid){el.innerHTML='<option value="">Choose state first</option>';return}
  const{data}=await sb.from('lgas').select('id,name').eq('state_id',sid).order('name');el.innerHTML='<option value="">Choose LGA</option>'+opts(data||[],sel,'id','name')}
async function wProfile(){
  await loadW();const defS=W?W.state_id:(ST.find(s=>s.name===me.state)||{}).id;
  const AV=[['available','Available'],['busy','Busy'],['unavailable','Not available']].map(a=>({id:a[0],name:a[1]}));
  $('view').innerHTML=`<div class="card"><b>${esc(me.full_name)}</b> ${W?badge(W.verification):''}<p class="mut">${W?'Keep your profile up to date.':'Complete your profile so employers can find you.'}</p>
  <label>Occupation</label><select id="pc"><option value="">Choose…</option>${opts(CT,W&&W.category_id,'id','name')}</select>
  <label>State</label><select id="ps"><option value="">Choose…</option>${opts(ST,defS,'id','name')}</select>
  <label>LGA</label><select id="pl"></select>
  <label>City or town</label><input id="pcity" value="${esc((W&&W.city)||me.city||'')}">
  <label>Headline (max 80 characters)</label><input id="phd" maxlength="80" value="${esc(W&&W.headline||'')}">
  <label>About you (max 800 characters)</label><textarea id="pbio" rows="4" maxlength="800">${esc(W&&W.bio||'')}</textarea>
  <label>Years of experience</label><input id="pyr" type="number" min="0" max="60" value="${esc(W&&W.years_experience!=null?W.years_experience:'')}">
  <label>Availability</label><select id="pav">${opts(AV,W&&W.availability,'id','name')}</select>
  <label class="chk"><input type="checkbox" id="pvis" ${(!W||W.is_visible)?'checked':''}> Show my profile to employers</label>
  <button class="btn" id="psave">Save profile</button></div>`;
  fillL(defS,W&&W.lga_id);$('ps').onchange=()=>fillL($('ps').value,null);
  $('psave').onclick=()=>guard(async()=>{
    const row={category_id:num($('pc').value),state_id:num($('ps').value),lga_id:num($('pl').value),city:$('pcity').value.trim()||null,headline:$('phd').value.trim()||null,bio:$('pbio').value.trim()||null,years_experience:num($('pyr').value),availability:$('pav').value,is_visible:$('pvis').checked};
    if(!row.category_id||!row.state_id)throw new Error('Choose your occupation and state.');
    const{error}=W?await sb.from('worker_profiles').update(row).eq('user_id',me.id):await sb.from('worker_profiles').insert({user_id:me.id,...row});
    if(error)throw error;toast('Profile saved');wProfile();
  });
}
async function upl(f,tag,bucket='id-documents'){const ext=(f.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'');const path=`${me.id}/${tag}-${Date.now()}.${ext}`;
  const{error}=await sb.storage.from(bucket).upload(path,f,{contentType:f.type});if(error)throw error;return path}
async function wVerify(){
  await loadW();
  if(!W){$('view').innerHTML='<div class="card">Please complete and save your profile first (My profile tab).</div>';return}
  const{data:L}=await sb.from('verification_requests').select('*').eq('worker_id',me.id).order('id',{ascending:false}).limit(1);
  const last=(L||[])[0],pending=last&&last.status==='submitted',can=W.verification!=='verified'&&!pending;
  let h=`<div class="card"><b>Your verification</b> ${badge(W.verification)}`;
  if(W.verification==='verified')h+='<p>Your documents were checked by a Verilo admin. This does not guarantee behaviour or safety.</p>';
  if(pending)h+='<p>Your documents are with our team for review. You will get a notification when there is an update.</p>';
  if(last&&last.admin_note&&!pending)h+=`<p class="mut">Message from the reviewer: ${esc(last.admin_note)}</p>`;
  h+='<p class="mut">Verification is free and is never affected by payments.</p></div>';
  if(can)h+=`<div class="card"><b>Submit documents</b><p class="mut">Free. Photos are stored privately. Only authorised Verilo admins can view them, and they never appear on your profile.</p>
  <label>ID type</label><select id="vt"><option value="nin_slip">NIN slip</option><option value="voters_card">Voter’s card</option><option value="drivers_licence">Driver’s licence</option><option value="intl_passport">International passport</option></select>
  <label>Photo of your ID (max 5 MB)</label><input id="vid" type="file" accept="image/*,application/pdf">
  <label>A clear selfie (max 5 MB)</label><input id="vsf" type="file" accept="image/*">
  <label class="chk"><input type="checkbox" id="vc"> I consent to Verilo checking my documents and contacting my references.</label>
  <button class="btn" id="vgo">Submit for review</button></div>`;
  if(last&&last.status==='rejected')h+=`<div class="card"><b>Appeal this decision</b><textarea id="apm" rows="3" placeholder="Explain why the decision should be reviewed (10 or more characters)"></textarea><button class="btn alt" id="apgo">Send appeal</button></div>`;
  $('view').innerHTML=h;
  if($('vgo'))$('vgo').onclick=()=>guard(async()=>{
    const a=$('vid').files[0],b=$('vsf').files[0];
    if(!a||!b)throw new Error('Choose both your ID photo and a selfie.');
    if(!$('vc').checked)throw new Error('Consent is needed before verification.');
    if(a.size>5242880||b.size>5242880)throw new Error('Each file must be under 5 MB.');
    $('vgo').disabled=true;toast('Uploading…');
    const p1=await upl(a,'id'),p2=await upl(b,'selfie');
    await rpc('submit_verification',{p_id_type:$('vt').value,p_id_doc_path:p1,p_selfie_path:p2,p_consent:true});
    toast('Submitted for review');wVerify();
  });
  if($('apgo'))$('apgo').onclick=()=>guard(async()=>{await rpc('file_appeal',{p_verification_id:last.id,p_message:$('apm').value.trim()});toast('Appeal sent');wVerify()});
}
async function wReviews(){
  const[a,b]=await Promise.all([sb.from('worker_rating_summary').select('*').eq('worker_id',me.id).maybeSingle(),sb.from('public_reviews').select('*').eq('worker_id',me.id).order('created_at',{ascending:false})]);
  const s=a.data,l=b.data||[];
  $('view').innerHTML=`<div class="card"><b>${s?`<span class="stars">★</span> ${esc(s.average_rating)} average from ${esc(s.review_count)} review${Number(s.review_count)===1?'':'s'}`:'No reviews yet'}</b><p class="mut">Employers can review you after a completed job.</p></div>`+l.map(r=>`<div class="card"><span class="stars">${stars(r.rating)}</span><p>${esc(r.comment||'')}</p><div class="mut">${esc(r.reviewer_first_name)} · ${esc(when(r.created_at))}</div></div>`).join('');
}

/* ---------- EMPLOYER SEARCH ---------- */
let F={state:'',cat:'',avail:'',ver:false,q:'',off:0};
function eFind(){
  F.off=0;
  $('view').innerHTML=`<div class="card"><input id="fq" placeholder="Search name or skill" value="${esc(F.q)}">
  <select id="fs"><option value="">All of Nigeria</option>${STN.map(s=>`<option${F.state===s?' selected':''}>${esc(s)}</option>`).join('')}</select>
  <select id="fc"><option value="">All occupations</option>${opts(CT,F.cat,'slug','name')}</select>
  <select id="fa"><option value="">Any availability</option><option value="available">Available now</option></select>
  <label class="chk"><input type="checkbox" id="fv" ${F.ver?'checked':''}> Verified workers only</label>
  <button class="btn" id="fgo">Search</button></div><div id="res"></div>`;
  $('fgo').onclick=()=>{F={state:$('fs').value,cat:$('fc').value,avail:$('fa').value,ver:$('fv').checked,q:$('fq').value.trim(),off:0};guard(search)};
  guard(search);
}
async function search(){
  const d=await rpc('search_workers',{p_state:F.state||null,p_category_slug:F.cat||null,p_availability:F.avail||null,p_verified_only:F.ver,p_query:F.q||null,p_limit:20,p_offset:F.off});
  const tot=d.length?Number(d[0].total_count):0;let rt={};
  if(d.length){const{data}=await sb.from('worker_rating_summary').select('*').in('worker_id',d.map(w=>w.user_id));rt=Object.fromEntries((data||[]).map(x=>[x.worker_id,x]))}
  $('res').innerHTML=`<p class="mut">${tot} worker${tot===1?'':'s'} found</p>`+d.map(w=>{const r=rt[w.user_id];return `<div class="card"><div class="row"><div class="av">${esc(ini(w.full_name))}</div><div style="flex:1"><b>${esc(w.full_name)}</b><div class="mut">${esc(w.category||'')} · ${esc([w.city,w.lga,w.state].filter(Boolean).join(', '))}</div>${w.headline?`<div>${esc(w.headline)}</div>`:''}<div style="margin-top:4px">${badge(w.verification_status)} <span class="mut">${r?'<span class="stars">★</span> '+esc(r.average_rating)+' ('+esc(r.review_count)+') · ':''}${w.years_experience!=null?esc(w.years_experience)+' yrs · ':''}${w.availability==='available'?'Available':esc(w.availability)}</span></div></div></div><button class="btn" data-act="hire" data-id="${esc(w.user_id)}" data-n="${esc(w.full_name)}">Send hiring request</button><button class="btn alt" data-act="rep" data-id="${esc(w.user_id)}" data-n="${esc(w.full_name)}">Report</button></div>`}).join('')+
  `<div>${F.off>0?'<button class="btn alt" data-act="pg" data-o="-20">← Previous</button>':''}${F.off+20<tot?'<button class="btn alt" data-act="pg" data-o="20">Next →</button>':''}</div>`;
}
function modal(html){const m=$('modal');m.hidden=false;m.innerHTML='<div>'+html+'<button class="btn alt" id="mclose">Close</button></div>';$('mclose').onclick=()=>{m.hidden=true}}
function shut(){$('modal').hidden=true}
function openHire(id,name){
  modal(`<b>Hiring request for ${esc(name)}</b><label>Job title</label><input id="ht" maxlength="100" placeholder="e.g. Weekly house cleaning"><label>Details</label><textarea id="hd" rows="3" maxlength="1000"></textarea><label>Start date</label><input id="hs" type="date"><label>Location</label><input id="hl" maxlength="150" placeholder="Area, city, state"><label>Pay offer (₦)</label><input id="hp" type="number" min="0"><p class="mut">This starts a booking. You and the worker then agree the final terms, and a deposit is optional. Keep chat and payment details on Verilo. Never share OTP codes or bank PINs.</p><button class="btn" id="hsend">Send request</button>`);
  $('hsend').onclick=()=>guard(async()=>{
    if($('ht').value.trim().length<3)throw new Error('Enter a job title.');
    await rpc('send_hire_request',{p_worker:id,p_title:$('ht').value.trim(),p_description:$('hd').value.trim()||null,p_start:$('hs').value||null,p_location:$('hl').value.trim()||null,p_pay:num($('hp').value)});

function bCard(b,pays,can,rfs){

  if(['accepted','negotiating'].includes(st)){
    h+=`<p class="mut">${b.i_confirmed?'You confirmed these terms. Waiting for the other party.':b.other_confirmed?'The other party confirmed these terms. Please review and confirm.':'Agree the price, date, location and whether a deposit is needed. A deposit is optional.'}</p>`;

  }

  if(st==='awaiting_payment')h+='<p class="mut">Waiting for the deposit. The employer reports it and the worker confirms receipt.</p>';
  if(st==='confirmed'&&!emp)h+=B('start','Start work');
  if(st==='in_progress')h+=b.my_completed?'<p class="mut">You confirmed completion. Waiting for the other party.</p>':B('done','Confirm job complete');
  if(emp&&['awaiting_payment','confirmed','in_progress','completed'].includes(st))h+=B('pay','Report a payment','alt');
  if(st==='completed'&&emp&&!b.reviewed)h+=`<button class="btn" data-act="rev" data-id="${b.hiring_request_id}">Leave a review</button>`;
  if(can)h+=can.requested_by===me.id?'<p class="mut">You asked to cancel. Waiting for a reply.</p>':`<p>The other party asked to cancel: “${esc(can.reason)}”</p><button class="btn" data-act="cany" data-id="${can.id}">Accept cancellation</button><button class="btn alt" data-act="cdec" data-id="${can.id}">Decline</button>`;

  if(!['requested','cancelled'].includes(st))h+=B('disp',b.open_dispute?'View dispute':'Report a problem','alt');
  if(!['requested','accepted','negotiating','cancelled'].includes(st))h+=B('agree','View agreement','alt');
  h+=`<button class="btn alt" data-act="chat" data-c="${b.conversation_id}" data-t="${esc(b.title)}" data-o="${esc(b.other_name)}">Message${b.unread>0?' ('+b.unread+' new)':''}</button>`;
  h+=pays.map(p=>{const rf=rfs.find(r=>r.payment_id===p.id);return `<div class="pay"><div class="mut">${p.kind==='deposit'?'Deposit':'Balance'} ${ngn(p.amount_ngn)} · paid ${esc(p.paid_on)} · ${esc(PM[p.method]||p.method)}${p.reference?' · Ref '+esc(p.reference):''}</div><b>${esc(PS[p.status]||p.status)}</b>${p.note?` <span class="mut">— ${esc(p.note)}</span>`:''}<div>
  ${p.evidence_path?`<button class="btn alt" data-act="evid" data-p="${esc(p.evidence_path)}">View receipt</button>`:''}
  ${!emp&&p.status==='reported_paid'?`<button class="btn" data-act="pconf" data-pid="${p.id}">I received it</button><button class="btn red" data-act="pdis" data-pid="${p.id}">I did not receive it</button>`:''}
  ${emp&&['reported_paid','receipt_confirmed'].includes(p.status)&&!rf?`<button class="btn alt" data-act="refund" data-pid="${p.id}" data-amt="${p.amount_ngn}">Request refund</button>`:''}
  ${rf?(emp?`<span class="mut">Refund of ${ngn(rf.amount_ngn)} requested. Waiting for the worker.</span>`:`<span class="mut">Refund requested: ${ngn(rf.amount_ngn)} — “${esc(rf.reason)}”</span><button class="btn" data-act="rfa" data-id="${rf.id}">Approve refund</button><button class="btn alt" data-act="rfd" data-id="${rf.id}">Decline</button>`):''}

}
function postCard(p){
  const media=(p.media||[]).map(m=>m.kind==='video'?`<video controls playsinline preload="metadata" data-mp="${esc(m.path)}" style="width:100%;border-radius:10px;margin-top:6px"></video>`:`<img data-mp="${esc(m.path)}" alt="Post photo" style="width:100%;border-radius:10px;margin-top:6px">`).join('');
  const sh=p.shared_post_id?`<div class="card" style="margin:8px 0 0">${p.shared_author?`<b>${esc(p.shared_author)}</b><p>${esc(p.shared_body||'')}</p>`:'<span class="mut">The original post is not available.</span>'}</div>`:'';
  return `<div class="card"><div class="row"><div class="av" data-n="prof" data-u="${esc(p.author_id)}" style="cursor:pointer">${esc(ini(p.author_name))}</div><div style="flex:1"><b data-n="prof" data-u="${esc(p.author_id)}" style="cursor:pointer">${esc(p.author_name)}</b> ${p.verification?badge(p.verification):''}<div class="mut">${esc(p.author_detail||p.author_role)} · ${esc(when(p.created_at))}</div></div></div>
  <div class="mut" style="margin-top:6px">${esc(KIND[p.kind]||p.kind)}${p.is_promoted?' · <b>Promoted</b>':''}</div><p style="white-space:pre-wrap;margin:6px 0">${esc(p.body||'')}</p>${sh}${media}
  <div style="margin-top:8px"><button class="btn alt sm" data-n="like" data-id="${p.id}">${p.liked?'♥':'♡'} ${p.like_count}</button><button class="btn alt sm" data-n="cmt" data-id="${p.id}">💬 ${p.comment_count}</button><button class="btn alt sm" data-n="share" data-id="${p.id}">↪ Share</button><button class="btn alt sm" data-n="menu" data-id="${p.id}" data-u="${esc(p.author_id)}" data-name="${esc(p.author_name)}">⋯</button></div></div>`;
}
async function openComments(pid){
  const d=await rpc('get_comments',{p_post:pid,p_limit:50,p_offset:0});
  modal(`<b>Comments</b>${d.length?d.map(c=>`<div class="bub them"><b>${esc(c.author_name)}</b><br>${esc(c.body)}<div class="mut">${esc(when(c.created_at))}</div>${c.author_id!==me.id?`<button class="btn alt sm" data-n="rc" data-id="${c.id}">Report</button>`:''}</div>`).join(''):'<p class="mut">No comments yet.</p>'}<textarea id="cm" rows="2" maxlength="1000" placeholder="Write a comment"></textarea><button class="btn" id="csend">Comment</button>`);
  $('csend').onclick=()=>guard(async()=>{const t=$('cm').value.trim();if(!t)throw new Error('Write a comment first.');await rpc('add_comment',{p_post:pid,p_body:t});openComments(pid)});
}
function openShare(id){
  modal(`<b>Share this post</b><p class="mut">It will appear on your profile and in your followers’ feeds.</p><textarea id="sc" rows="2" maxlength="1000" placeholder="Add a comment (optional)"></textarea><button class="btn" id="ssend">Share</button>`);
  $('ssend').onclick=()=>guard(async()=>{await rpc('create_post',{p_kind:'update',p_body:$('sc').value.trim(),p_visibility:'public',p_media:[],p_shared:id});shut();toast('Shared');home()});
}
function openMenu(id,uid,name){
  modal(uid===me.id?`<button class="btn red" data-n="del" data-id="${id}">Delete my post</button>`:`<button class="btn alt" data-n="rp" data-id="${id}">Report this post</button><button class="btn red" data-n="block" data-u="${esc(uid)}">Block ${esc(name)}</button>`);
}
function openContentReport(pid,cid){
  modal(`<b>Report ${pid?'this post':'this comment'}</b><label>Reason</label><select id="cr">${CR.map(r=>`<option value="${r[0]}">${esc(r[1])}</option>`).join('')}</select><label>Details (for copyright, name your original work and where it was published)</label><textarea id="cd" rows="3" maxlength="1000"></textarea><button class="btn red" id="crs">Send report</button>`);
  $('crs').onclick=()=>guard(async()=>{await rpc('report_content',{p_post:pid,p_comment:cid,p_reason:$('cr').value,p_details:$('cd').value.trim()||null});shut();toast('Report sent to Verilo admins')});
}

/* ----- create post ----- */
function newPost(){
  $('view').innerHTML=`<div class="card"><b>Create a post</b><label>Type</label><select id="nk">${KINDS[me.role].map(k=>`<option value="${k}">${esc(KIND[k])}</option>`).join('')}</select>
  <label>What would you like to share?</label><textarea id="nb" rows="5" maxlength="2000"></textarea>
  <label>Photos or videos (up to 6; photos 5 MB, videos 25 MB)</label><input id="nf" type="file" accept="image/*,video/*" multiple>
  <label>Who can see this?</label><select id="nv"><option value="public">Everyone on Verilo</option><option value="followers">Only my followers</option></select>
  <label class="chk"><input type="checkbox" id="nc"> I confirm this post does not show ID documents, phone or bank numbers, or private information about children.</label>
  <button class="btn" id="npost">Publish</button></div>`;
  $('npost').onclick=()=>guard(async()=>{
    if(!$('nc').checked)throw new Error('Please tick the confirmation first.');
    const fs=[...$('nf').files];if(fs.length>6)throw new Error('You can add up to 6 files.');
    for(const f of fs){const v=f.type.startsWith('video/'),i=f.type.startsWith('image/');if(!v&&!i)throw new Error('Only photos and videos are allowed.');if(f.size>(v?26214400:5242880))throw new Error((v?'Videos must be under 25 MB.':'Photos must be under 5 MB.'))}
    $('npost').disabled=true;toast('Publishing…');
    const media=[];
    for(let k=0;k<fs.length;k++){const f=fs[k],ext=(f.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,''),path=`${me.id}/post-${Date.now()}-${k}.${ext}`;
      const{error}=await sb.storage.from('post-media').upload(path,f,{contentType:f.type});if(error)throw error;media.push({kind:f.type.startsWith('video/')?'video':'image',path})}
    try{await rpc('create_post',{p_kind:$('nk').value,p_body:$('nb').value.trim(),p_visibility:$('nv').value,p_media:media,p_shared:null})}
    catch(e){$('npost').disabled=false;if(media.length)sb.storage.from('post-media').remove(media.map(m=>m.path));throw e}
    toast('Posted');FD.mode='latest';go('hm');
  });
}

/* ----- network & profiles ----- */
async function network(){
  const d=await rpc('suggest_people',{p_limit:30});
  $('view').innerHTML='<p class="mut">People and businesses you may want to follow.</p>'+(d.length?'':'<div class="card">No suggestions right now.</div>')+d.map(u=>`<div class="card"><div class="row"><div class="av" data-n="prof" data-u="${esc(u.id)}" style="cursor:pointer">${esc(ini(u.full_name))}</div><div style="flex:1"><b data-n="prof" data-u="${esc(u.id)}" style="cursor:pointer">${esc(u.full_name)}</b> ${u.verification?badge(u.verification):''}<div class="mut">${esc(u.detail||u.role)}${u.state?' · '+esc(u.state):''} · ${esc(u.followers)} follower${Number(u.followers)===1?'':'s'}</div></div></div><button class="btn sm" data-n="follow" data-u="${esc(u.id)}">Follow</button><button class="btn alt sm" data-n="prof" data-u="${esc(u.id)}">View profile</button></div>`).join('');
}
async function showProfile(uid){
  hl('pf');const d=await rpc('social_profile',{p_user:uid}),p=d[0];if(!p)throw new Error('This profile is not available.');
  const own=uid===me.id;let rt='';
  if(p.role==='worker'){const{data}=await sb.from('worker_rating_summary').select('*').eq('worker_id',uid).maybeSingle();if(data)rt=`<div><span class="stars">★</span> ${esc(data.average_rating)} (${esc(data.review_count)} reviews)</div>`}
  FD={mode:'user',off:0,user:uid};
  $('view').innerHTML=`<div class="card"><div class="row"><div class="av">${esc(ini(p.full_name))}</div><div style="flex:1"><b>${esc(p.full_name)}</b> ${p.verification?badge(p.verification):''}<div class="mut">${esc(p.detail||p.role)}${p.state?' · '+esc(p.state):''}${p.city?', '+esc(p.city):''}</div></div></div>
  ${p.headline?`<p><b>${esc(p.headline)}</b></p>`:''}${p.bio?`<p>${esc(p.bio)}</p>`:''}${rt}<div class="mut">${esc(p.posts)} posts · ${esc(p.followers)} followers · ${esc(p.following)} following</div>
  ${own?(me.role==='worker'?'<button class="btn" data-n="editp">Edit profile</button>':'')+'<button class="btn alt" data-n="newp">New post</button>':`<button class="btn" data-n="fprof" data-u="${esc(uid)}">${p.i_follow?'Following ✓':'Follow'}</button>${p.role==='worker'&&me.role==='employer'?`<button class="btn alt" data-n="hirew" data-u="${esc(uid)}" data-name="${esc(p.full_name)}">Send hiring request</button>`:''}<button class="btn alt" data-n="repu" data-u="${esc(uid)}" data-name="${esc(p.full_name)}">Report</button><button class="btn red" data-n="block" data-u="${esc(uid)}">Block</button>`}</div><h3>Posts</h3><div id="feed"></div><div id="more"></div>`;
  loadFeed(false).catch(e=>toast(e.message,true));
}

/* ----- jobs ----- */
function jobs(){me.role==='worker'?workerJobs():employerJobs()}
const money=(a,b)=>a==null&&b==null?'Pay not stated':a!=null&&b!=null?`${ngn(a)} – ${ngn(b)}`:a!=null?`From ${ngn(a)}`:`Up to ${ngn(b)}`;
async function workerJobs(){
  $('view').innerHTML=`<div class="seg"><button data-n="jt" data-t="browse" class="${JT==='browse'?'on':''}">Browse jobs</button><button data-n="jt" data-t="apps" class="${JT==='apps'?'on':''}">My applications</button></div><div id="jb"></div>`;
  if(JT==='apps'){
    const d=await rpc('my_applications');
    $('jb').innerHTML=(d.length?'':'<div class="card">You have not applied for any jobs yet.</div>')+d.map(a=>`<div class="card"><b>${esc(a.title)}</b><div class="mut">${esc(a.employer_name)} · applied ${esc(when(a.created_at))}</div><p><span class="badge b-u">${esc(JS_[a.status]||a.status)}</span>${a.job_status!=='open'?' <span class="mut">(job '+esc(a.job_status)+')</span>':''}</p>${['applied','viewed','shortlisted'].includes(a.status)?`<button class="btn alt sm" data-n="wd" data-id="${a.id}">Withdraw</button>`:''}</div>`).join('');return}
  $('jb').innerHTML=`<div class="card"><input id="jq" placeholder="Search jobs" value="${esc(JF.q)}"><select id="jst"><option value="">All of Nigeria</option>${STN.map(s=>`<option${JF.state===s?' selected':''}>${esc(s)}</option>`).join('')}</select><select id="jca"><option value="">All occupations</option>${opts(CT,JF.cat,'slug','name')}</select><button class="btn" id="jgo">Search</button></div><div id="jres"></div>`;
  $('jgo').onclick=()=>{JF={q:$('jq').value.trim(),state:$('jst').value,cat:$('jca').value};guard(runJobs)};
  await runJobs();
}
async function runJobs(){
  const d=await rpc('get_jobs',{p_state:JF.state||null,p_category_slug:JF.cat||null,p_query:JF.q||null,p_limit:20,p_offset:0});
  $('jres').innerHTML=`<p class="mut">${d.length?(d[0].total_count>d.length?`Showing ${d.length} of ${d[0].total_count} jobs`:`${d.length} job${d.length===1?'':'s'}`):''}</p>`+(d.length?'':'<div class="card">No open jobs match your search.</div>')+d.map(j=>`<div class="card"><b>${esc(j.title)}</b><div class="mut"><span data-n="prof" data-u="${esc(j.employer_id)}" style="cursor:pointer;text-decoration:underline">${esc(j.employer_name)}</span> · ${esc(j.category||'Any occupation')} · ${esc([j.city,j.lga,j.state].filter(Boolean).join(', ')||'Nigeria')}</div><div>${money(j.pay_min_ngn,j.pay_max_ngn)}</div><p>${esc(j.description.length>300?j.description.slice(0,300)+'…':j.description)}</p>${j.requirements?`<p class="mut">Requirements: ${esc(j.requirements)}</p>`:''}<div class="mut">Closes ${esc(when(j.expires_at))}</div>${j.applied?'<span class="badge b-v">Applied ✓</span>':`<button class="btn sm" data-n="apply" data-id="${j.id}" data-title="${esc(j.title)}">Apply</button>`}</div>`).join('')+'<p class="mut">Never pay money to apply for a job. Report any job that asks for a fee.</p>';
}
function openApply(id,title){
  modal(`<b>Apply: ${esc(title)}</b><p class="mut">The employer sees your name, occupation, location, verification status and ratings.</p><textarea id="am" rows="4" maxlength="1000" placeholder="Short message to the employer (optional)"></textarea><button class="btn" id="asend">Send application</button>`);
  $('asend').onclick=()=>guard(async()=>{await rpc('apply_to_job',{p_job:id,p_message:$('am').value.trim()||null});shut();toast('Application sent');runJobs()});
}
async function employerJobs(){
  const d=await rpc('my_jobs');
  $('view').innerHTML=`<button class="btn" data-n="pjob">+ Post a job</button>`+(d.length?'':'<div class="card">You have not posted any jobs yet.</div>')+d.map(j=>`<div class="card"><b>${esc(j.title)}</b> <span class="badge b-u">${esc(j.status)}</span><div class="mut">${esc(j.applicants)} applicant${Number(j.applicants)===1?'':'s'}${j.new_applicants>0?` (${esc(j.new_applicants)} new)`:''} · closes ${esc(when(j.expires_at))}</div><button class="btn sm" data-n="appl" data-id="${j.id}" data-title="${esc(j.title)}">Applicants</button>${j.status==='open'?`<button class="btn alt sm" data-n="cjob" data-id="${j.id}">Close job</button>`:''}</div>`).join('');
}
function postJobModal(){
  modal(`<b>Post a job</b><label>Job title</label><input id="jn1" maxlength="100"><label>Description</label><textarea id="jn2" rows="4" maxlength="2000"></textarea><label>Requirements (optional)</label><textarea id="jn3" rows="2" maxlength="1000"></textarea>
  <label>Occupation</label><select id="jn4"><option value="">Choose…</option>${opts(CT,'','id','name')}</select><label>State</label><select id="jn5"><option value="">Choose…</option>${opts(ST,'','id','name')}</select><label>LGA</label><select id="jn6"><option value="">Choose state first</option></select><label>City or town</label><input id="jn7" maxlength="80">
  <label>Pay from (₦, optional)</label><input id="jn8" type="number" min="0"><label>Pay up to (₦, optional)</label><input id="jn9" type="number" min="0"><label>Keep open for</label><select id="jn10"><option value="14">14 days</option><option value="30" selected>30 days</option><option value="60">60 days</option></select>
  <p class="mut">Never ask workers for money, ID numbers or bank details in a job post. Fees for applying are not allowed.</p><button class="btn" id="jpost">Publish job</button>`);
  $('jn5').onchange=async()=>{const s=$('jn5').value;if(!s){$('jn6').innerHTML='<option value="">Choose state first</option>';return}const{data}=await sb.from('lgas').select('id,name').eq('state_id',s).order('name');$('jn6').innerHTML='<option value="">Any LGA</option>'+opts(data||[],'','id','name')};
  $('jpost').onclick=()=>guard(async()=>{
    await rpc('create_job',{p_title:$('jn1').value.trim(),p_description:$('jn2').value.trim(),p_category_id:num($('jn4').value),p_state_id:num($('jn5').value),p_lga_id:num($('jn6').value),p_city:$('jn7').value.trim()||null,p_pay_min:num($('jn8').value),p_pay_max:num($('jn9').value),p_requirements:$('jn3').value.trim()||null,p_days:Number($('jn10').value)});
    shut();toast('Job published');employerJobs();
  });
}
async function openApplicants(jid,title){
  const d=await rpc('job_applicants',{p_job:jid});
  modal(`<b>Applicants: ${esc(title)}</b>`+(d.length?'':'<p class="mut">No applicants yet.</p>')+d.map(a=>`<div class="card" style="margin-top:8px"><b data-n="prof" data-u="${esc(a.worker_id)}" style="cursor:pointer">${esc(a.full_name)}</b> ${a.verification?badge(a.verification):''}<div class="mut">${esc(a.category||'')} · ${esc(a.state||'')}${a.avg_rating?` · ★ ${esc(a.avg_rating)} (${esc(a.review_count)})`:''}</div>${a.message?`<p>${esc(a.message)}</p>`:''}<p><span class="badge b-u">${esc(JS_[a.status]||a.status)}</span></p>
  <button class="btn alt sm" data-n="ast" data-id="${a.application_id}" data-s="shortlisted" data-j="${jid}" data-title="${esc(title)}">Shortlist</button><button class="btn alt sm" data-n="ast" data-id="${a.application_id}" data-s="rejected" data-j="${jid}" data-title="${esc(title)}">Not selected</button><button class="btn sm" data-n="ast" data-id="${a.application_id}" data-s="hired" data-j="${jid}" data-title="${esc(title)}">Hired</button><button class="btn alt sm" data-n="hirew" data-u="${esc(a.worker_id)}" data-name="${esc(a.full_name)}">Send hiring request</button></div>`).join(''));
}

/* ----- clicks ----- */
document.addEventListener('click',e=>{
  const x=e.target.closest('[data-n]');if(!x)return;const a=x.dataset.n,id=Number(x.dataset.id),u=x.dataset.u,g=guard;
  if(a==='mode'){FD.mode=x.dataset.m;home()}
  if(a==='more')g(()=>loadFeed(true));
  if(a==='prof'){shut();g(()=>showProfile(u))}
  if(a==='like')g(async()=>{const cur0=Number(x.textContent.replace(/\D/g,''))||0,l=await rpc('toggle_like',{p_post:id});x.textContent=(l?'♥ ':'♡ ')+(cur0+(l?1:-1))});
  if(a==='cmt')g(()=>openComments(id));
  if(a==='share')openShare(id);
  if(a==='menu')openMenu(id,u,x.dataset.name);
  if(a==='rp')openContentReport(id,null);
  if(a==='rc')openContentReport(null,id);
  if(a==='repu')openReport(u,x.dataset.name);
  if(a==='del'&&confirm('Delete this post?'))g(async()=>{await rpc('delete_post',{p_post:id});shut();toast('Deleted');cur==='pf'?showProfile(me.id):home()});
  if(a==='block'&&confirm('Block this person? You will no longer see each other’s posts, profiles or jobs.'))g(async()=>{await rpc('toggle_block',{p_user:u});shut();toast('Blocked');go('hm')});
  if(a==='follow')g(async()=>{const f=await rpc('toggle_follow',{p_user:u});x.textContent=f?'Following ✓':'Follow'});
  if(a==='fprof')g(async()=>{const f=await rpc('toggle_follow',{p_user:u});toast(f?'Following':'Unfollowed');showProfile(u)});
  if(a==='editp')go('wp');if(a==='newp')go('np');
  if(a==='hirew')openHire(u,x.dataset.name);
  if(a==='jt'){JT=x.dataset.t;jobs()}
  if(a==='apply')openApply(id,x.dataset.title);
  if(a==='wd')g(async()=>{await rpc('withdraw_application',{p_app:id});toast('Withdrawn');jobs()});
  if(a==='pjob')postJobModal();
  if(a==='appl')g(()=>openApplicants(id,x.dataset.title));
  if(a==='cjob'&&confirm('Close this job? Applicants will no longer see it.'))g(async()=>{await rpc('close_job',{p_job:id,p_filled:false});toast('Job closed');employerJobs()});
  if(a==='ast')g(async()=>{await rpc('set_application_status',{p_app:id,p_status:x.dataset.s});toast('Updated');openApplicants(Number(x.dataset.j),x.dataset.title)});
});
</script></body></html>
