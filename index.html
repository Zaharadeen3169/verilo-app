<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Verilo — Verify People. Build Trust.</title>
<style>
:root{--navy:#102A43;--teal:#00C2A8;--acc:#007A6C;--bg:#F3F6F9;--card:#fff;--text:#102A43;--mut:#5b6f82;--line:#dfe6ed;--warn:#b7791f;--bad:#c0392b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0b1c2c;--card:#142f47;--text:#f3f6f9;--mut:#9fb3c6;--line:#24435f;--acc:#00C2A8}}
:root[data-theme=dark]{--bg:#0b1c2c;--card:#142f47;--text:#f3f6f9;--mut:#9fb3c6;--line:#24435f;--acc:#00C2A8}
*{box-sizing:border-box}html{height:100%}
body{margin:0;font-family:"Plus Jakarta Sans","Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.45}
#app{max-width:520px;margin:0 auto;min-height:100vh;padding-bottom:76px}
.top{background:var(--navy);color:#fff;padding:16px 18px;display:flex;align-items:center;gap:10px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.top h1{font-size:18px;margin:0;flex:1}.top button{background:none;border:0;color:#fff;font-size:20px;padding:4px 8px}
.pg{padding:16px 18px}h3{font-size:15px;margin:14px 0 6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.btn{display:block;width:100%;background:var(--teal);color:var(--navy);font-weight:700;border:0;border-radius:12px;padding:14px;font-size:16px;margin:10px 0}
.btn.alt{background:transparent;border:2px solid var(--teal);color:var(--text)}.btn[disabled]{opacity:.6}
input,select,textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;font:inherit;background:var(--card);color:var(--text);margin:4px 0 10px}
label{font-size:13px;color:var(--mut);font-weight:600}.chk{display:flex;gap:8px;align-items:flex-start}.chk input{width:auto;margin-top:3px}
.row{display:flex;gap:10px;align-items:center}.row>*{flex:1}.row .fit{flex:none}
.av{width:52px;height:52px;border-radius:50%;background:var(--navy);color:var(--teal);display:grid;place-items:center;font-weight:800}
.badge{font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;background:#e8edf2;color:#4a5d70}
.b-verified{background:#d9f7f1;color:#00695c}.b-under_review{background:#fdf0cf;color:var(--warn)}.b-rejected{background:#fbe0dc;color:var(--bad)}
.mut{color:var(--mut);font-size:13px}
.hero{background:linear-gradient(165deg,#071a2b,#102A43 55%,#0b3d4a);color:#fff;min-height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:30px}
.hero p{color:#b8c9d9}.hero .btn{max-width:320px}.hero .alt{color:#fff}.hero h1{font-size:44px;margin:6px 0}
nav.tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs button{flex:1;background:none;border:0;padding:10px 2px;font-size:11px;color:var(--mut)}nav.tabs b{display:block;font-size:20px}nav.tabs .on{color:var(--acc);font-weight:700}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px}.chip{white-space:nowrap;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:99px;padding:6px 12px;font-size:13px}.chip.on{background:var(--navy);color:#fff}
[role=button]{cursor:pointer}:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
#toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#102A43;color:#fff;padding:10px 16px;border-radius:10px;z-index:9;max-width:90%;text-align:center;display:none}
</style></head><body><div id="app"></div><div id="toast" role="status"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
/* ===== CONFIG: change these to match your database ===== */
const URL_='https://maeraxyuwiwnlujctlzt.supabase.co', KEY='sb_publishable_gLotKP2jJGgtYaGD44bcmg_3K00b_qK'; // testnet. Swap for production at launch.
const T={profiles:'profiles',verif:'verification_requests',hire:'hire_requests',dir:'worker_directory'};
// worker data lives in worker_profiles; employers browse the worker_directory view (no phone numbers)
/* ======================================================= */
const sb=supabase.createClient(URL_,KEY),$=s=>document.querySelector(s),val=id=>($('#'+id)||{}).value||'';
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const STATES=["Abia","Adamawa","Akwa Ibom","Anambra","Bauchi","Bayelsa","Benue","Borno","Cross River","Delta","Ebonyi","Edo","Ekiti","Enugu","FCT (Abuja)","Gombe","Imo","Jigawa","Kaduna","Kano","Katsina","Kebbi","Kogi","Kwara","Lagos","Nasarawa","Niger","Ogun","Ondo","Osun","Oyo","Plateau","Rivers","Sokoto","Taraba","Yobe","Zamfara"];
let CATS=[];
const IDS=[["nin_slip","NIN slip"],["voters_card","Voter's card"],["drivers_licence","Driver's licence"],["intl_passport","International passport"]];
const LOGO=s=>`<svg width="${s}" height="${s}" viewBox="0 0 64 64" aria-label="Verilo logo"><path d="M32 4 56 13v18c0 15-10 25-24 29C18 56 8 46 8 31V13z" fill="#00C2A8"/><path d="M21 32l8 8 15-17" fill="none" stroke="#102A43" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const ngn=n=>n==null?'—':'₦'+Number(n).toLocaleString(), ini=n=>esc((n||'?').split(' ').map(x=>x[0]).join(''));
const label=s=>String(s||'unverified').replace(/_/g,' ');
const badge=s=>`<span class="badge b-${esc(s)}">${esc(label(s))}</span>`;
const sel=(id,arr,ph)=>`<select id="${id}"><option value="">${ph}</option>${arr.map(a=>Array.isArray(a)?`<option value="${a[0]}">${a[1]}</option>`:`<option>${esc(a)}</option>`).join('')}</select>`;
const tabs={worker:[["wdash","🏠","Home"],["settings","⚙️","Settings"]],employer:[["find","🔍","Find"],["settings","⚙️","Settings"]]};
let S={me:null,screen:'welcome',hist:[],list:[],sel:null,f:{c:'All',s:'',q:''},busy:false};
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t._t);t._t=setTimeout(()=>t.style.display='none',3500)}
async function run(fn){if(S.busy)return;S.busy=true;try{await fn()}catch(e){toast(e.message||String(e))}S.busy=false}
function go(s,back){if(!back)S.hist.push(S.screen);S.screen=s;render();scrollTo(0,0)}
function back(){S.screen=S.hist.pop()||'welcome';render()}
const hdr=(t,b=true)=>`<div class="top">${b?'<button onclick="back()" aria-label="Back">←</button>':''}<h1>${t}</h1>${LOGO(26)}</div>`;
const home=()=>S.me.role==='worker'?'wdash':'find';

async function loadMe(){
  const{data:{session}}=await sb.auth.getSession();if(!session){S.me=null;return}
  const{data,error}=await sb.from(T.profiles).select('*').eq('id',session.user.id).single();
  if(error||!data||data.status==='suspended'||data.role==='admin'){await sb.auth.signOut();S.me=null;if(data&&data.role==='admin')toast('Use the admin page for admin accounts.');return}
  S.me=data;
}
const V={
welcome:()=>`<div class="hero">${LOGO(84)}<h1>verilo</h1><p>Verify People. Build Trust.<br>A trusted platform for workers and employers in Nigeria.</p><button class="btn" onclick="go('type')">Get started</button><button class="btn alt" onclick="go('login')">Log in</button><p style="font-size:12px">Verification confirms documents were checked. It does not guarantee a person's behaviour or safety.</p></div>`,
login:()=>`${hdr('Log in')}<div class="pg"><label for="em">Email</label><input id="em" type="email" autocomplete="username"><label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password"><button class="btn" onclick="doLogin()">Log in</button><button class="btn alt" onclick="go('type')">Create account</button></div>`,
type:()=>`${hdr('I am a…')}<div class="pg"><div class="card" role="button" tabindex="0" onclick="S.role='worker';go('signup')"><h3>🧰 Worker</h3><p class="mut">Create a profile, get verified, receive job requests. Free.</p></div><div class="card" role="button" tabindex="0" onclick="S.role='employer';go('signup')"><h3>🏡 Employer</h3><p class="mut">Find and hire workers for your home or business.</p></div></div>`,
signup:()=>{const w=S.role==='worker';return `${hdr(w?'Worker sign up':'Employer sign up')}<div class="pg"><label for="n">Full name</label><input id="n" autocomplete="name"><label for="em">Email</label><input id="em" type="email" autocomplete="username"><label for="pw">Password (8+ characters)</label><input id="pw" type="password" autocomplete="new-password"><label for="ph">Phone number</label><input id="ph" type="tel" autocomplete="tel"><label for="st">State</label>${sel('st',STATES,'Choose state')}<label for="ci">City or LGA</label><input id="ci">${w?`<label for="oc">Occupation</label>${sel('oc',CATS.map(c=>[c.id,c.name]),'Choose occupation')}<label for="ex">Years of experience</label><input id="ex" type="number" min="0">`:''}<label class="chk"><input id="ag" type="checkbox"> I agree to the Terms and Privacy Policy (NDPA)</label><button class="btn" onclick="doSignup()">Create account</button></div>`},
wdash:()=>{const r=S.req,v=S.wp&&S.wp.verification||'unverified';
  const st=v==='verified'?'verified':r?(r.status==='approved'?'verified':r.status==='rejected'?'rejected':'under_review'):v;
  return `${hdr('Hello, '+esc((S.me.full_name||'').split(' ')[0]),false)}<div class="pg"><div class="card"><div class="row"><div><b>Verification</b><div class="mut">${st==='verified'?'Your documents were checked by a Verilo admin.':st==='under_review'?'A Verilo admin is checking your documents.':st==='rejected'?'Not approved. '+esc(r&&r.admin_note||'Contact support.'):'Submit your documents to start review.'}</div></div><div class="fit">${badge(st)}</div></div>${st!=='verified'&&st!=='under_review'?`<button class="btn" onclick="go('verify')">${r?'Submit again':'Start verification'}</button>`:''}</div><div class="card"><label class="chk"><input type="checkbox" ${S.wp&&S.wp.is_visible===false?'':'checked'} onchange="setVis(this.checked)"> Show my profile to employers</label></div><p class="mut">Verification is free. It does not guarantee behaviour or safety.</p></div>`},
verify:()=>`${hdr('Verify your identity')}<div class="pg"><label for="vid">ID type</label>${sel('vid',IDS,'Choose ID')}<label for="f1">ID photo (stored privately)</label><input id="f1" type="file" accept="image/*,application/pdf"><label for="f2">Selfie</label><input id="f2" type="file" accept="image/*"><label class="chk"><input id="vc" type="checkbox"> I consent to Verilo checking my documents.</label><button class="btn" onclick="doVerify()">Submit for review</button><p class="mut">Documents are never shown on your public profile.</p></div>`,
find:()=>{const f=S.f,l=S.list.filter(w=>(f.c==='All'||w.category===f.c)&&(!f.s||w.state===f.s)&&(!f.q||((w.full_name||'')+(w.category||'')).toLowerCase().includes(f.q.toLowerCase())));
  return `${hdr('Find workers',false)}<div class="pg"><input id="q" aria-label="Search" placeholder="Search name or skill" value="${esc(f.q)}" oninput="S.f.q=this.value;render(1)"><div class="chips">${['All',...CATS.map(c=>c.name)].map(c=>`<button class="chip ${f.c===c?'on':''}" onclick="S.f.c=this.textContent;render()">${esc(c)}</button>`).join('')}</div><select aria-label="State" onchange="S.f.s=this.value;render()"><option value="">All of Nigeria</option>${STATES.map(s=>`<option ${f.s===s?'selected':''}>${s}</option>`).join('')}</select>${l.length?l.map(w=>`<div class="card" role="button" tabindex="0" onclick="S.sel='${esc(w.id)}';go('profile')"><div class="row"><div class="av fit">${ini(w.full_name)}</div><div><b>${esc(w.full_name)}</b><div class="mut">${esc(w.category||'Worker')} · ${esc(w.city||'')} ${esc(w.state||'')}</div><div style="margin-top:4px">${badge(w.verification||'unverified')}</div></div></div></div>`).join(''):'<div class="card">No workers match. Try another state or occupation.</div>'}</div>`},
profile:()=>{const w=S.list.find(x=>x.id===S.sel);if(!w)return `${hdr('Worker profile')}<div class="pg">Worker not found.</div>`;
  return `${hdr('Worker profile')}<div class="pg"><div class="card" style="text-align:center"><div class="av" style="margin:0 auto 8px;width:72px;height:72px;font-size:24px">${ini(w.full_name)}</div><h2 style="margin:0">${esc(w.full_name)}</h2><div class="mut">${esc(w.category||'')} · ${esc(w.city||'')} ${esc(w.state||'')}</div><p>${badge(w.verification||'unverified')}</p><p>${esc(w.headline||'')}</p><p class="mut">${esc(w.years_experience??0)} years experience${w.availability?' · '+esc(w.availability):''}</p></div><div class="card mut">${w.verification==='verified'?'Documents checked by a Verilo admin. ID numbers are never shown. Verification does not guarantee behaviour or safety.':'Not yet verified. Consider this when deciding.'}</div><button class="btn" onclick="go('hire')">Send hiring request</button></div>`},
hire:()=>{const w=S.list.find(x=>x.id===S.sel)||{};return `${hdr('Hiring request')}<div class="pg"><div class="card"><b>${esc(w.full_name)}</b><div class="mut">${esc(w.category||'')}</div></div><label for="hd">Job description</label><textarea id="hd" rows="3"></textarea><label for="hs">Start date</label><input id="hs" type="date"><label for="hl">Location</label><input id="hl" placeholder="Area, city, state"><label for="hp">Pay offer (₦)</label><input id="hp" type="number" min="0"><button class="btn" onclick="doHire()">Send request</button></div>`},
settings:()=>`${hdr('Settings',false)}<div class="pg"><div class="card"><label for="th">Appearance</label><select id="th" onchange="setTheme(this.value)"><option value="">System default</option><option value="light">Light</option><option value="dark">Dark</option></select></div><button class="btn alt" onclick="run(reqDelete)">Request account deletion</button><button class="btn" onclick="doLogout()">Log out</button></div>`
};
function setTheme(v){v?document.documentElement.setAttribute('data-theme',v):document.documentElement.removeAttribute('data-theme');try{localStorage.setItem('verilo_theme',v)}catch(e){}}
try{const t=localStorage.getItem('verilo_theme');if(t)setTheme(t)}catch(e){}

async function data(){
  if(['signup','find'].includes(S.screen)&&!CATS.length){const{data:c}=await sb.from('categories').select('id,name').eq('active',true).order('name');CATS=c||[]}
  if(!S.me)return;
  if(S.screen==='wdash'){const[{data:r},{data:w}]=await Promise.all([sb.from(T.verif).select('*').eq('worker_id',S.me.id).order('id',{ascending:false}).limit(1),sb.from('worker_profiles').select('*').eq('user_id',S.me.id).maybeSingle()]);S.req=r&&r[0]||null;S.wp=w}
  if(['find','profile','hire'].includes(S.screen)&&!S.list.length){const{data:l,error}=await sb.from(T.dir).select('*');if(error)throw error;S.list=l||[]}
}
async function render(keep){
  if(S.me&&!tabs[S.me.role].some(t=>t[0]===S.screen)&&['welcome','login','type','signup'].includes(S.screen)){S.screen=home();S.hist=[]}
  try{await data()}catch(e){toast(e.message)}
  const sc=S.screen,show=S.me&&!['verify','profile','hire'].includes(sc);
  $('#app').innerHTML=V[sc]()+(show?`<nav class="tabs">${tabs[S.me.role].map(t=>`<button class="${t[0]===sc?'on':''}" onclick="S.hist=[];go('${t[0]}',1)"><b>${t[1]}</b>${t[2]}</button>`).join('')}</nav>`:'');
  if(sc==='settings'){const th=document.documentElement.getAttribute('data-theme')||'';$('#th').value=th}
  if(keep){const q=$('#q');if(q){q.focus();q.setSelectionRange(q.value.length,q.value.length)}}
}
const doLogin=()=>run(async()=>{
  const{error}=await sb.auth.signInWithPassword({email:val('em').trim(),password:val('pw')});if(error)throw error;
  await loadMe();if(!S.me)throw new Error('This account cannot sign in here.');S.hist=[];S.list=[];go(home(),1);
});
const doSignup=()=>run(async()=>{
  const w=S.role==='worker';
  if(!val('n').trim()||!val('em').trim()||!val('ph').trim()||!val('st')||(w&&!val('oc')))throw new Error('Please fill in all required fields.');
  if(val('pw').length<8)throw new Error('Password must be at least 8 characters.');
  if(!$('#ag').checked)throw new Error('Please accept the Terms and Privacy Policy.');
  const{data,error}=await sb.auth.signUp({email:val('em').trim(),password:val('pw'),options:{data:{full_name:val('n').trim(),role:S.role}}});if(error)throw error;
  if(!data.session)return toast('Check your email to confirm your account, then log in.');
  const{error:e2}=await sb.from(T.profiles).upsert({id:data.user.id,role:S.role,full_name:val('n').trim(),phone:val('ph').trim(),state:val('st'),city:val('ci').trim()});if(e2)throw e2;
  if(w){const{error:e3}=await sb.from('worker_profiles').upsert({user_id:data.user.id,category_id:val('oc'),years_experience:Number(val('ex'))||0,city:val('ci').trim()});if(e3)throw e3}
  await loadMe();S.hist=[];go(home(),1);
});
const setVis=v=>run(async()=>{const{error}=await sb.from('worker_profiles').update({is_visible:v}).eq('user_id',S.me.id);if(error)throw error;toast(v?'Profile visible to employers':'Profile hidden from employers')});
const doVerify=()=>run(async()=>{
  const f1=$('#f1').files[0],f2=$('#f2').files[0];
  if(!val('vid'))throw new Error('Choose your ID type.');if(!f1||!f2)throw new Error('Add your ID photo and a selfie.');
  if(!$('#vc').checked)throw new Error('Please give consent so we can check your documents.');
  for(const f of[f1,f2])if(f.size>8*1024*1024)throw new Error('Each file must be under 8 MB.');
  const up=async(f,k)=>{const p=`${S.me.id}/${Date.now()}-${k}-${f.name.replace(/[^\w.\-]/g,'_')}`;const{error}=await sb.storage.from('id-documents').upload(p,f);if(error)throw error;return p};
  const a=await up(f1,'id'),b=await up(f2,'selfie');
  const{error}=await sb.from(T.verif).insert({worker_id:S.me.id,id_type:val('vid'),id_doc_path:a,selfie_path:b,consent_at:new Date().toISOString()});
  if(error)throw error;toast('Submitted. Status: under review');back();
});
const doHire=()=>run(async()=>{
  if(!val('hd').trim())throw new Error('Describe the job first.');
  const{error}=await sb.from(T.hire).insert({employer_id:S.me.id,worker_id:S.sel,description:val('hd').trim(),start_date:val('hs')||null,location:val('hl').trim(),offer_ngn:Number(val('hp'))||null});
  if(error)throw error;toast('Request sent');back();
});
async function reqDelete(){if(!confirm('Request deletion of your account?'))return;const{error}=await sb.rpc('request_account_deletion');if(error)throw error;toast('Deletion request recorded')}
async function doLogout(){await sb.auth.signOut();S={me:null,screen:'welcome',hist:[],list:[],sel:null,f:{c:'All',s:'',q:''},busy:false};render()}
(async()=>{await loadMe();if(S.me)S.screen=home();render()})();
</script></body></html>
