<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Verilo — Verify People. Build Trust.</title>
<style>
:root{--navy:#0F2A47;--teal:#12B5A6;--acc:#00796B;--bg:#F3F6F9;--card:#fff;--text:#102A43;--mut:#5b6f82;--line:#dfe6ed;--warn:#b7791f;--bad:#c0392b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0A1B2E;--card:#12304F;--text:#f3f6f9;--mut:#9fb3c6;--line:#24435f;--acc:#00C2A8}}
:root[data-theme=dark]{--bg:#0A1B2E;--card:#12304F;--text:#f3f6f9;--mut:#9fb3c6;--line:#24435f;--acc:#00C2A8}
*{box-sizing:border-box}html{height:100%}
body{margin:0;font-family:"Plus Jakarta Sans","Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.45}
#app{max-width:520px;margin:0 auto;min-height:100vh;padding-bottom:76px}
.top{background:var(--navy);color:#fff;padding:16px 18px;display:flex;align-items:center;gap:10px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.top h1{font-size:18px;margin:0;flex:1}.top button{background:none;border:0;color:#fff;font-size:20px;padding:4px 8px}
.pg{padding:16px 18px}h3{font-size:15px;margin:14px 0 6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.btn{display:block;width:100%;background:var(--teal);color:var(--navy);font-weight:700;border:0;border-radius:12px;padding:14px;font-size:16px;margin:10px 0}
.btn.alt{background:transparent;border:2px solid var(--teal);color:var(--text)}.btn[disabled]{opacity:.6}
input,select,textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;font:inherit;background:var(--card);color:var(--text);margin:4px 0 10px}
label{font-size:13px;color:var(--mut);font-weight:600}.chk{display:flex;gap:8px;align-items:flex-start}.chk input{width:auto;margin-top:3px}
.row{display:flex;gap:10px;align-items:center}.row>*{flex:1}.row .fit{flex:none}
.av{width:52px;height:52px;border-radius:50%;background:var(--navy);color:var(--teal);display:grid;place-items:center;font-weight:800}
.badge{font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;background:#e8edf2;color:#4a5d70}
.b-verified{background:#d9f7f1;color:#00695c}.b-under_review{background:#fdf0cf;color:var(--warn)}.b-rejected,.b-declined{background:#fbe0dc;color:var(--bad)}.b-accepted{background:#d9f7f1;color:#00695c}.b-pending{background:#fdf0cf;color:var(--warn)}
.mut{color:var(--mut);font-size:13px}.msg{padding:9px 12px;border-radius:14px;margin:6px 0;max-width:80%;white-space:pre-wrap;overflow-wrap:anywhere}.me{background:var(--teal);color:var(--navy);margin-left:auto}.them{background:var(--card);border:1px solid var(--line)}
.hero{background:linear-gradient(165deg,#071a2b,#102A43 55%,#0b3d4a);color:#fff;min-height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:30px}
.hero p{color:#b8c9d9}.hero .btn{max-width:320px}.hero .alt{color:#fff}.hero h1{font-size:44px;margin:6px 0}
nav.tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs button{flex:1;background:none;border:0;padding:10px 2px;font-size:11px;color:var(--mut)}nav.tabs b{display:block;font-size:20px}nav.tabs .on{color:var(--acc);font-weight:700}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px}.chip{white-space:nowrap;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:99px;padding:6px 12px;font-size:13px}.chip.on{background:var(--navy);color:#fff}
[role=button]{cursor:pointer}:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
#toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#102A43;color:#fff;padding:10px 16px;border-radius:10px;z-index:9;max-width:90%;text-align:center;display:none}
.hero{position:relative;overflow:hidden;background:radial-gradient(90% 45% at 50% 105%,#12b5a644,transparent 65%),radial-gradient(70% 35% at 100% 0,#12b5a62e,transparent 70%),linear-gradient(165deg,#071a2b,#0F2A47 55%,#0b3d4a)}
.hero>*{position:relative;z-index:1}.hero:after{content:"";position:absolute;left:-25%;right:-25%;bottom:-38%;height:62%;border-radius:50%;border:2px solid #12b5a666}
.hero h1{font-size:46px;letter-spacing:-1px;margin:8px 0 0}.hero .tag{font-size:18px;margin:4px 0 10px}.hero em{color:#19e6cc;font-style:normal}.hero .fine{font-size:12px;margin-top:18px}
.top .lg{display:flex;align-items:center;gap:8px;font-weight:800;font-size:20px;flex:1}
.top .avs{width:34px;height:34px;border-radius:50%;background:var(--teal);color:var(--navy);font-weight:800;font-size:13px;padding:0}
.hero2{background:linear-gradient(135deg,#0F2A47,#0b4350);color:#fff;border-radius:16px;padding:18px;margin-bottom:12px}.hero2 h2{margin:0 0 8px;font-size:20px}.hero2 p{margin:8px 0 0;color:#c4d6e6}
.chipv{background:#1fa86a;color:#fff;font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:var(--teal)}
.sw{appearance:none;-webkit-appearance:none;width:46px;padding:0;height:26px;border-radius:99px;background:var(--line);position:relative;margin:0;border:0;flex:none}.sw:checked{background:var(--teal)}
.sw:after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.15s}.sw:checked:after{left:23px}
.stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}.sc{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 6px;text-align:center}.sc b{display:block;font-size:22px}.sc span{font-size:12px;color:var(--mut)}.sc .i{display:block;font-size:20px}
.pills{display:flex;gap:8px;overflow-x:auto;margin-bottom:10px}.pills select{width:auto;margin:0;border-radius:99px;padding:8px 12px;font-size:13px}.pills .chip{padding:8px 14px}
.btn.h{padding:10px;font-size:14px;margin:0}.tick{color:var(--acc);font-size:13px}
.opt{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--card);color:var(--text);border:2px solid var(--line);border-radius:14px;padding:12px;margin-bottom:8px;font:inherit}.opt.on{border-color:var(--teal)}.opt small{color:var(--mut)}
.pm{display:block;width:100%;border-radius:12px;margin-top:8px;max-height:60vh;object-fit:cover;background:#0003}
</style></head><body><div id="app"></div><div id="toast" role="status"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
/* ===== CONFIG: change these to match your database ===== */
const URL_='https://maeraxyuwiwnlujctlzt.supabase.co', KEY='sb_publishable_gLotKP2jJGgtYaGD44bcmg_3K00b_qK'; // testnet. Swap for production at launch.
const T={profiles:'profiles',verif:'verification_requests',hire:'hire_requests',dir:'worker_directory'};
// worker data lives in worker_profiles; employers browse the worker_directory view (no phone numbers)
/* ======================================================= */
const sb=supabase.createClient(URL_,KEY),$=s=>document.querySelector(s),val=id=>($('#'+id)||{}).value||'';
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const STATES=["Abia","Adamawa","Akwa Ibom","Anambra","Bauchi","Bayelsa","Benue","Borno","Cross River","Delta","Ebonyi","Edo","Ekiti","Enugu","FCT (Abuja)","Gombe","Imo","Jigawa","Kaduna","Kano","Katsina","Kebbi","Kogi","Kwara","Lagos","Nasarawa","Niger","Ogun","Ondo","Osun","Oyo","Plateau","Rivers","Sokoto","Taraba","Yobe","Zamfara"];
let CATS=[];
let IDS=[],AV=[];const pretty=s=>{s=String(s||'').replace(/_/g,' ');return s.charAt(0).toUpperCase()+s.slice(1)};const enums=async t=>{const{data,error}=await sb.rpc('enum_labels',{p_type:t});if(error)throw error;return data||[]};
const LOGO=s=>`<svg width="${s}" height="${s}" viewBox="0 0 64 64" aria-label="Verilo logo"><path d="M32 5 55 14v17c0 14-9.5 24-23 28C18.5 55 9 45 9 31V14z" fill="none" stroke="#19D3C0" stroke-width="4.5" stroke-linejoin="round"/><path d="M21 32l8 8 15-17" fill="none" stroke="#19D3C0" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const ngn=n=>n==null?'—':'₦'+Number(n).toLocaleString(), ini=n=>esc((n||'?').split(' ').map(x=>x[0]).join(''));
const label=s=>String(s||'unverified').replace(/_/g,' ');
const badge=s=>`<span class="badge b-${esc(s)}">${esc(label(s))}</span>`;
const sel=(id,arr,ph)=>`<select id="${id}"><option value="">${ph}</option>${arr.map(a=>Array.isArray(a)?`<option value="${a[0]}">${a[1]}</option>`:`<option>${esc(a)}</option>`).join('')}</select>`;
const tabs={worker:[["wdash","🏠","Home"],["feed","👥","Community"],["jobs","💼","Jobs"],["inbox","💬","Messages"],["settings","👤","Profile"]],employer:[["find","🏠","Home"],["feed","👥","Community"],["jobs","💼","Jobs"],["inbox","💬","Messages"],["settings","👤","Profile"]]};
let S={me:null,screen:'welcome',hist:[],list:[],sel:null,f:{c:'All',s:'',q:''},busy:false};
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t._t);t._t=setTimeout(()=>t.style.display='none',3500)}
async function run(fn){if(S.busy)return;S.busy=true;try{await fn()}catch(e){toast(e.message||String(e))}S.busy=false}
function go(s,back){if(!back)S.hist.push(S.screen);S.screen=s;if(s==='jobs')S.jobs=null;if(s==='find')S.fst=null;render();scrollTo(0,0)}
function back(){S.screen=S.hist.pop()||'welcome';render()}
const hdr=(t,b=true)=>`<div class="top">${b?'<button onclick="back()" aria-label="Back">←</button>':''}<h1>${t}</h1>${LOGO(26)}</div>`;
const home=()=>S.me.role==='worker'?'wdash':'find';
const curTheme=()=>document.documentElement.getAttribute('data-theme')||'';
const homeHdr=()=>`<div class="top"><span class="lg">${LOGO(28)}verilo</span><button onclick="go('notifs')" aria-label="Alerts">🔔</button><button class="avs" onclick="S.hist=[];go('settings',1)" aria-label="Profile">${ini(S.me.full_name)}</button></div>`;

async function loadMe(){
  const{data:{session}}=await sb.auth.getSession();if(!session){S.me=null;return}
  const{data,error}=await sb.from(T.profiles).select('*').eq('id',session.user.id).single();
  if(error||!data||data.status==='suspended'||data.role==='admin'){await sb.auth.signOut();S.me=null;if(data&&data.role==='admin')toast('Use the admin page for admin accounts.');return}
  S.me=data;
}
const V={
welcome:()=>`<div class="hero">${LOGO(104)}<h1>verilo</h1><h2 class="tag">Verify People. <em>Build Trust.</em></h2><p>A trusted platform for workers, employers and opportunities in Nigeria.</p><button class="btn" onclick="go('type')">Get Started →</button><button class="btn alt" onclick="go('login')">Login</button><p class="fine">Verification confirms documents were checked. It does not guarantee a person's behaviour or safety.</p><p class="fine">Version 16</p></div>`,
login:()=>`${hdr('Log in')}<div class="pg"><label for="em">Email</label><input id="em" type="email" autocomplete="username"><label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password"><button class="btn" onclick="doLogin()">Log in</button><button class="btn alt" onclick="go('type')">Create account</button><p style="text-align:center"><a href="#" onclick="forgotPw();return false" style="color:var(--acc);font-weight:700">Forgot password?</a></p></div>`,
type:()=>`${hdr('I am a…')}<div class="pg"><div class="card" role="button" tabindex="0" onclick="S.role='worker';go('signup')"><h3>🧰 Worker</h3><p class="mut">Create a profile, get verified, receive job requests. Free.</p></div><div class="card" role="button" tabindex="0" onclick="S.role='employer';go('signup')"><h3>🏡 Employer</h3><p class="mut">Find and hire workers for your home or business.</p></div></div>`,
signup:()=>{const w=S.role==='worker';return `${hdr(w?'Worker sign up':'Employer sign up')}<div class="pg"><label for="n">Full name</label><input id="n" autocomplete="name"><label for="em">Email</label><input id="em" type="email" autocomplete="username"><label for="pw">Password (8+ characters)</label><input id="pw" type="password" autocomplete="new-password"><label for="ph">Phone number</label><input id="ph" type="tel" autocomplete="tel"><label for="st">State</label>${sel('st',STATES,'Choose state')}<label for="ci">City or LGA</label><input id="ci">${w?`<label for="oc">Occupation</label>${sel('oc',CATS.map(c=>[c.id,c.name]),'Choose occupation')}<label for="ex">Years of experience</label><input id="ex" type="number" min="0">`:`<label for="et">Account type</label><select id="et"><option value="household">Household</option><option value="business">Business</option></select>`}<label class="chk"><input id="ag" type="checkbox"> I agree to the Terms and Privacy Policy (NDPA)</label><button class="btn" onclick="doSignup()">Create account</button></div>`},
wdash:()=>{const r=S.req,v=S.wp&&S.wp.verification||'unverified',w=S.wp||{};
  const st=v==='verified'?'verified':r?(r.status==='approved'?'verified':r.status==='rejected'?'rejected':'under_review'):v;
  const pct=Math.round([w.category_id,w.headline,w.bio,w.years_experience>0,w.city,st==='verified'].filter(Boolean).length/6*100);
  const hr=new Date().getHours(),gr=hr<12?'Good morning':hr<17?'Good afternoon':'Good evening';
  const n1=(a,f)=>(a||[]).filter(f).length,pend=n1(S.reqs,x=>x.status==='pending'),act=n1(S.bks,x=>['awaiting_payment','confirmed','in_progress'].includes(x.status)),done=n1(S.bks,x=>x.status==='completed');
  const earn=(S.bks||[]).reduce((t,b)=>t+Number(b.deposit_confirmed||0)+Number(b.balance_confirmed||0),0),rate=S.rs&&Number(S.rs.review_count)?Number(S.rs.average_rating).toFixed(1):'—';
  return `${homeHdr()}<div class="pg"><div class="hero2"><h2>${gr}, ${esc((S.me.full_name||'').split(' ')[0])}!</h2>${st==='verified'?'<span class="chipv">✓ Verified</span>':badge(st)}<p>Find work. Grow your career.</p></div><div class="row" style="margin-bottom:12px"><button class="btn h alt" onclick="go('sent')">📨 Requests</button><button class="btn h alt" onclick="go('bookings')">📋 Bookings</button></div>${st!=='verified'?`<div class="card"><b>Verification</b><div class="mut">${st==='under_review'?'A Verilo admin is checking your documents.':st==='rejected'?'Not approved. '+esc(r&&r.admin_note||'Contact support.'):'Submit your documents to start review.'}</div>${st!=='under_review'?`<button class="btn" onclick="go('verify')">${r?'Submit again':'Start verification'}</button>`:''}${st==='rejected'&&r?`<button class="btn alt" onclick="appealV(${Number(r.id)})">Appeal this decision</button>`:''}</div>`:''}<div class="card"><div class="row"><b>Profile completion</b><b class="fit" style="color:var(--acc)">${pct}%</b></div><div class="bar"><i style="width:${pct}%"></i></div>${pct<100?`<button class="btn alt" style="margin-bottom:0" onclick="go('editp')">Complete my profile</button>`:''}</div><div class="card"><div class="row"><b>Available for work</b><input type="checkbox" class="sw fit" aria-label="Available for work" ${w.is_visible===false?'':'checked'} onchange="setVis(this.checked)"></div><div class="mut">Employers can find you in search.</div></div><div class="stat3"><div class="sc"><span class="i">📨</span><b>${pend}</b><span>Job requests</span></div><div class="sc"><span class="i">💰</span><b>${ngn(earn)}</b><span>Earnings</span></div><div class="sc"><span class="i">⭐</span><b>${rate}</b><span>Rating</span></div></div><div class="row" style="margin:14px 0 4px"><h3 style="margin:0">Job requests</h3><a class="fit" href="#" onclick="go('sent');return false" style="color:var(--acc);font-weight:700;font-size:14px">View all</a></div>${reqList(x=>x.status==='pending')}<button class="btn" onclick="go('newpost')">＋ Create a post</button><p class="mut">Verification is free. It does not guarantee behaviour or safety.</p></div>`},
verify:()=>`${hdr('Verify your identity')}<div class="pg"><label for="vid">ID type</label>${sel('vid',IDS.map(v=>[v,pretty(v)]),'Choose ID')}<label for="f1">ID photo (stored privately)</label><input id="f1" type="file" accept="image/*,application/pdf"><label for="f2">Selfie</label><input id="f2" type="file" accept="image/*"><label class="chk"><input id="vc" type="checkbox"> I consent to Verilo checking my documents.</label><button class="btn" onclick="doVerify()">Submit for review</button><p class="mut">Documents are never shown on your public profile.</p></div>`,
find:()=>{const f=S.f,l=S.list.filter(w=>(f.c==='All'||w.category===f.c)&&(!f.s||w.state===f.s)&&(!f.v||w.verification==='verified')&&(!f.q||((w.full_name||'')+(w.category||'')).toLowerCase().includes(f.q.toLowerCase())));
  return `${homeHdr()}<div class="pg"><div class="hero2"><h2>Welcome back, ${esc((S.me.full_name||'').split(' ')[0])}!</h2><p>Find the best workers for your needs.</p></div><div class="row" style="margin-bottom:12px"><button class="btn h alt" onclick="go('sent')">📨 Requests</button><button class="btn h alt" onclick="go('bookings')">📋 Bookings</button></div><div class="stat3"><div class="sc"><span class="i">📨</span><b>${(S.reqs||[]).length}</b><span>Requests sent</span></div><div class="sc"><span class="i">💼</span><b>${(S.myj||[]).filter(j=>j.status==='open').length}</b><span>Open jobs</span></div><div class="sc"><span class="i">📋</span><b>${(S.bks||[]).length}</b><span>Bookings</span></div></div><div class="row" style="margin-bottom:12px"><button class="btn h" onclick="go('postjob')">＋ Post a job</button><button class="btn h alt" onclick="$('#q').scrollIntoView();$('#q').focus()">🔍 Request a service</button></div><div class="row"><h3 style="margin:0">Recent requests</h3><a class="fit" href="#" onclick="go('sent');return false" style="color:var(--acc);font-weight:700;font-size:14px">View all</a></div>${reqList((x,i)=>i<2)}<input id="q" aria-label="Search by skill or name" placeholder="🔍 Search by skill or name" value="${esc(f.q)}" oninput="S.f.q=this.value;render(1)"><div class="pills"><select aria-label="State" onchange="S.f.s=this.value;render()"><option value="">All states</option>${STATES.map(s=>`<option ${f.s===s?'selected':''}>${s}</option>`).join('')}</select><select aria-label="Skill" onchange="S.f.c=this.value||'All';render()"><option value="">Any skill</option>${CATS.map(c=>`<option ${f.c===c.name?'selected':''}>${esc(c.name)}</option>`).join('')}</select><button class="chip ${f.v?'on':''}" onclick="S.f.v=!S.f.v;render()">✓ Verified</button></div>${l.length?l.map(w=>`<div class="card"><div class="row"><div class="av fit">${ini(w.full_name)}</div><div><b>${esc(w.full_name)} ${w.verification==='verified'?'<span class="tick" title="Verified">✔</span>':''}</b><div class="mut">${esc(w.category||'Worker')} · ${esc(w.city||'')} ${esc(w.state||'')}</div><div style="margin-top:4px">${badge(w.verification||'unverified')} <span class="mut">${Number(w.review_count)?'★ '+Number(w.average_rating).toFixed(1)+' ('+Number(w.review_count)+')':'No reviews yet'}</span></div></div></div><div class="row" style="margin-top:10px"><button class="btn h" onclick="S.sel='${esc(w.id)}';go('profile')">View profile</button><button class="btn h alt" onclick="S.sel='${esc(w.id)}';go('hire')">Hire</button></div></div>`).join(''):'<div class="card">No workers match. Try another state or skill.</div>'}</div>`},
profile:()=>{const w=S.list.find(x=>x.id===S.sel);if(!w)return `${hdr('Worker profile')}<div class="pg">Worker not found.</div>`;
  return `${hdr('Worker profile')}<div class="pg"><div class="card" style="text-align:center"><div class="av" style="margin:0 auto 8px;width:72px;height:72px;font-size:24px">${ini(w.full_name)}</div><h2 style="margin:0">${esc(w.full_name)}</h2><div class="mut">${esc(w.category||'')} · ${esc(w.city||'')} ${esc(w.state||'')}</div><p>${badge(w.verification||'unverified')} ${Number(w.review_count)?'★ '+Number(w.average_rating).toFixed(1)+' ('+Number(w.review_count)+')':''}</p><p>${esc(w.headline||'')}</p><p class="mut">${esc(w.years_experience??0)} years experience${w.availability?' · '+esc(pretty(w.availability)):''}</p></div><div class="card mut">${w.verification==='verified'?'Documents checked by a Verilo admin. ID numbers are never shown. Verification does not guarantee behaviour or safety.':'Not yet verified. Consider this when deciding.'}</div><button class="btn" onclick="go('hire')">Send hiring request</button><button class="btn alt" style="border-color:var(--bad)" onclick="reportP('${esc(w.id)}')">Report this profile</button></div>`},
hire:()=>{const w=S.list.find(x=>x.id===S.sel)||{};return `${hdr('Hiring request')}<div class="pg"><div class="card"><b>${esc(w.full_name)}</b><div class="mut">${esc(w.category||'')}</div></div><label for="ht">Job title</label><input id="ht" maxlength="80" placeholder="e.g. Weekly house cleaning"><label for="hd">Job description</label><textarea id="hd" rows="3"></textarea><label for="hs">Start date</label><input id="hs" type="date"><label for="hl">Location</label><input id="hl" placeholder="Area, city, state"><label for="hp">Pay offer (₦)</label><input id="hp" type="number" min="0"><button class="btn" onclick="doHire()">Send request</button></div>`},

newpost:()=>{const k=S.me.role==='worker'?['update','work','achievement','availability','certificate','knowledge']:['update','opportunity','business'];return `${hdr('Create a post')}<div class="pg"><label for="pk">Post type</label>${sel('pk',k.map(x=>[x,pretty(x)]),'Choose type')}<label for="pb">What do you want to share?</label><textarea id="pb" rows="5" maxlength="1000"></textarea><label for="pv">Who can see it?</label><select id="pv"><option value="public">Everyone</option><option value="followers">Followers only</option></select><label for="pf">Photos or videos (up to 6)</label><input id="pf" type="file" accept="image/*,video/*" multiple><p class="mut">Do not post phone, ID, NIN, BVN or bank numbers.</p><button class="btn" onclick="savePost()">Post</button></div>`},

applicants:()=>`${hdr('Applicants')}<div class="pg">${(S.apl||[]).length?S.apl.map(a=>`<div class="card"><div class="row"><b>${esc(a.full_name)}</b><div class="fit">${badge(a.verification||'unverified')}</div></div><div class="mut">${esc(a.category||'')} ${esc(a.state||'')}${a.avg_rating?' · ★ '+Number(a.avg_rating).toFixed(1)+' ('+Number(a.review_count)+')':''}</div><p style="overflow-wrap:anywhere">${esc(a.message||'')}</p><div class="mut">Status: ${esc(pretty(a.status))}</div><div style="display:flex;gap:6px;margin-top:8px">${['shortlisted','hired','rejected'].map(x=>`<button class="btn h ${x==='rejected'?'alt':''}" style="flex:1" onclick="setApp(${Number(a.application_id)},'${x}')">${pretty(x)}</button>`).join('')}</div></div>`).join(''):'<div class="card mut">No applicants yet.</div>'}</div>`,

function setTheme(v){v?document.documentElement.setAttribute('data-theme',v):document.documentElement.removeAttribute('data-theme');try{localStorage.setItem('verilo_theme',v)}catch(e){}}
try{const t=localStorage.getItem('verilo_theme');if(t)setTheme(t)}catch(e){}

async function data(){
  if(S.screen==='verify'&&!IDS.length)IDS=await enums('id_type');
  if(S.screen==='editp'&&!AV.length)AV=await enums('availability');
  if(['signup','find','editp','jobs','postjob'].includes(S.screen)&&!CATS.length){const{data:c}=await sb.from('categories').select('id,name').eq('active',true).order('name');CATS=c||[]}
  if(!S.me)return;
  if(['wdash','sent','inbox'].includes(S.screen)){const{data:r,error}=await sb.rpc('my_requests');if(error)throw error;S.reqs=r||[]}
  if(['feed','comments'].includes(S.screen)){const c=S.fc||'all',{data:f,error}=await sb.rpc('get_feed',{p_mode:c==='following'?'following':c==='trending'?'trending':'home',p_limit:30});if(error)throw error;S.feed=f||[]}
  if(S.screen==='comments'){const{data:c,error}=await sb.rpc('get_comments',{p_post:S.pid});if(error)throw error;S.cm=c||[]}
  if(S.screen==='jobs'&&S.me.role==='worker'&&!S.jobs){const[{data:j,error},{data:a}]=await Promise.all([sb.rpc('get_jobs',{p_limit:50}),sb.rpc('my_applications')]);if(error)throw error;S.jobs=j||[];S.apps=a||[]}
  if(S.screen==='jobs'&&S.me.role==='employer'){const{data:m,error}=await sb.rpc('my_jobs');if(error)throw error;S.myj=m||[]}
  if(S.screen==='applicants'){const{data:a,error}=await sb.rpc('job_applicants',{p_job:S.jid});if(error)throw error;S.apl=a||[]}
  if(S.screen==='postjob'&&!S.sts){const{data:t,error}=await sb.from('states').select('id,name').order('name');if(error)throw error;S.sts=t||[]}
  if(S.screen==='find'&&S.me.role==='employer'&&!S.fst){const[a,b,c]=await Promise.all([sb.rpc('my_requests'),sb.rpc('my_bookings'),sb.rpc('my_jobs')]);S.reqs=a.data||[];S.bks=b.data||[];S.myj=c.data||[];S.fst=1}
  if(S.screen==='notifs'){const{data:n,error}=await sb.from('notifications').select('*').order('created_at',{ascending:false}).limit(50);if(error)throw error;S.notes=n||[]}
  if(S.screen==='disputeview'){const{data:d,error}=await sb.from('booking_disputes').select('*').eq('booking_id',S.bid).order('id',{ascending:false}).limit(1);if(error)throw error;S.disp=d&&d[0]||null;S.dmsgs=[];if(S.disp){const{data:m}=await sb.from('booking_dispute_messages').select('author_id,body,created_at').eq('dispute_id',S.disp.id).order('id');S.dmsgs=m||[]}}
  if(['wdash','bookings','terms','review','dispute','disputeview'].includes(S.screen)){const{data:b,error}=await sb.rpc('my_bookings');if(error)throw error;S.bks=b||[]}
  if(S.screen==='wdash'){const{data:x}=await sb.from('worker_rating_summary').select('*').eq('worker_id',S.me.id).maybeSingle();S.rs=x}
  if(['wdash','editp'].includes(S.screen)){const[{data:r},{data:w}]=await Promise.all([sb.from(T.verif).select('*').eq('worker_id',S.me.id).order('id',{ascending:false}).limit(1),sb.from('worker_profiles').select('*').eq('user_id',S.me.id).maybeSingle()]);S.req=r&&r[0]||null;S.wp=w}
  if(['find','profile','hire'].includes(S.screen)&&!S.list.length){const{data:l,error}=await sb.from(T.dir).select('*');if(error)throw error;S.list=l||[]}
}
async function render(keep){
  if(S.me&&!tabs[S.me.role].some(t=>t[0]===S.screen)&&['welcome','login','type','signup'].includes(S.screen)){S.screen=home();S.hist=[]}
  try{await data()}catch(e){toast(e.message)}
  const sc=S.screen,show=S.me&&!['verify','profile','hire','editp','chat','terms','review','dispute','disputeview','comments','newpost','postjob','applicants'].includes(sc);
  $('#app').innerHTML=V[sc]()+(show?`<nav class="tabs">${tabs[S.me.role].map(t=>`<button class="${t[0]===sc?'on':''}" onclick="S.hist=[];go('${t[0]}',1)"><b>${t[1]}</b>${t[2]}</button>`).join('')}</nav>`:'');
  hydrateMedia();clearInterval(S.t);if(sc==='chat'){loadChat(true);S.t=setInterval(()=>loadChat(false),5000)}

  if(keep){const q=$('#q');if(q){q.focus();q.setSelectionRange(q.value.length,q.value.length)}}
}
const doLogin=()=>run(async()=>{
  const{error}=await sb.auth.signInWithPassword({email:val('em').trim(),password:val('pw')});if(error)throw error;
  await loadMe();if(!S.me)throw new Error('This account cannot sign in here.');S.hist=[];S.list=[];go(home(),1);
});
const doSignup=()=>run(async()=>{
  const w=S.role==='worker';
  if(!val('n').trim()||!val('em').trim()||!val('ph').trim()||!val('st')||(w&&!val('oc')))throw new Error('Please fill in all required fields.');
  if(val('pw').length<8)throw new Error('Password must be at least 8 characters.');
  if(!$('#ag').checked)throw new Error('Please accept the Terms and Privacy Policy.');
  const{data,error}=await sb.auth.signUp({email:val('em').trim(),password:val('pw'),options:{data:{full_name:val('n').trim(),role:S.role,accepted_terms:true,phone:val('ph').trim(),state:val('st'),city:val('ci').trim(),employer_type:w?undefined:(val('et')||'household')}}});if(error)throw error;
  if(!data.session)return toast('Check your email to confirm your account, then log in.');
  const{error:e2}=await sb.from(T.profiles).upsert({id:data.user.id,role:S.role,full_name:val('n').trim(),phone:val('ph').trim(),state:val('st'),city:val('ci').trim()});if(e2)throw e2;
  if(w){const{error:e3}=await sb.from('worker_profiles').upsert({user_id:data.user.id,category_id:val('oc'),years_experience:Number(val('ex'))||0,city:val('ci').trim()});if(e3)throw e3}
  await loadMe();S.hist=[];go(home(),1);
});
const setVis=v=>run(async()=>{const{error}=await sb.from('worker_profiles').update({is_visible:v}).eq('user_id',S.me.id);if(error)throw error;toast(v?'Profile visible to employers':'Profile hidden from employers')});
const doVerify=()=>run(async()=>{
  const f1=$('#f1').files[0],f2=$('#f2').files[0];
  if(!val('vid'))throw new Error('Choose your ID type.');if(!f1||!f2)throw new Error('Add your ID photo and a selfie.');
  if(!$('#vc').checked)throw new Error('Please give consent so we can check your documents.');
  for(const f of[f1,f2])if(f.size>8*1024*1024)throw new Error('Each file must be under 8 MB.');
  const up=async(f,k)=>{const p=`${S.me.id}/${Date.now()}-${k}-${f.name.replace(/[^\w.\-]/g,'_')}`;const{error}=await sb.storage.from('id-documents').upload(p,f);if(error)throw error;return p};
  const a=await up(f1,'id'),b=await up(f2,'selfie');
  const{error}=await sb.rpc('submit_verification',{p_id_type:val('vid'),p_id_doc_path:a,p_selfie_path:b,p_consent:true});
  if(error)throw error;toast('Submitted. Status: under review');back();
});
const saveProfile=()=>run(async()=>{
  if(!val('oc'))throw new Error('Choose your occupation.');
  const{error}=await sb.from('worker_profiles').upsert({user_id:S.me.id,category_id:val('oc'),headline:val('hl').trim()||null,bio:val('bi').trim()||null,years_experience:Number(val('ex'))||0,city:val('ci').trim()||null,availability:val('av')||null});
  if(error)throw error;S.wp=null;toast('Profile saved');
}).then(()=>back());
const openChat=id=>{const r=(S.reqs||[]).concat(S.bks||[]).find(x=>Number(x.conversation_id)===id);S.chatId=id;S.chatName=r?r.other_name:'';go('chat')};
async function loadChat(scroll){try{const{data,error}=await sb.from('messages').select('id,sender_id,body,created_at').eq('conversation_id',S.chatId).order('id').limit(300);if(error)throw error;const el=$('#ml');if(!el)return;el.innerHTML=data.length?data.map(m=>`<div class="msg ${m.sender_id===S.me.id?'me':'them'}">${esc(m.body)}</div>`).join(''):'<p class="mut">No messages yet. Say hello.</p>';if(scroll)scrollTo(0,document.body.scrollHeight);sb.rpc('mark_messages_read',{p_conversation:S.chatId}).then(()=>{})}catch(e){clearInterval(S.t);toast(e.message)}}
const sendChat=()=>run(async()=>{const t=val('mi').trim();if(!t)return;const{error}=await sb.rpc('send_message',{p_conversation:S.chatId,p_body:t});if(error)throw error;$('#mi').value='';await loadChat(true)});
const ago=d=>{const m=Math.round((Date.now()-new Date(d))/60000);return m<60?m+'m ago':m<1440?Math.round(m/60)+'h ago':Math.round(m/1440)+'d ago'};
const postCard=p=>`<div class="card"><div class="row"><div class="av fit">${ini(p.author_name)}</div><div><b>${esc(p.author_name)} ${p.verification==='verified'?'<span class="tick">✔</span>':''}</b><div class="mut">${esc(p.author_detail||pretty(p.author_role))} · ${ago(p.created_at)}${p.is_promoted?' · Sponsored':''}</div></div></div><p style="white-space:pre-wrap;overflow-wrap:anywhere">${esc(p.body)}</p>${p.shared_body?`<div class="card mut">${esc(p.shared_author)}: ${esc(p.shared_body)}</div>`:''}${(p.media||[]).map(m=>m.kind==='video'?`<video class="pm" data-path="${esc(m.path)}" controls playsinline preload="metadata"></video>`:`<img class="pm" data-path="${esc(m.path)}" alt="Post photo">`).join('')}<div style="display:flex;gap:8px;margin-top:8px"><button class="chip" onclick="likeP(${Number(p.id)})">${p.liked?'♥':'♡'} ${Number(p.like_count)}</button><button class="chip" onclick="S.pid=${Number(p.id)};go('comments')">💬 ${Number(p.comment_count)}</button>${p.author_id===S.me.id?`<button class="chip" onclick="delP(${Number(p.id)})">Delete</button>`:''}</div></div>`;
const jobCard=j=>`<div class="card"><b>${esc(j.title)}</b><div class="mut">${esc(j.employer_name)} · ${esc(j.city||'')} ${esc(j.state||'')}${j.category?' · '+esc(j.category):''}</div><div style="margin:4px 0">${j.pay_min_ngn||j.pay_max_ngn?ngn(j.pay_min_ngn)+' – '+ngn(j.pay_max_ngn):'Pay to be agreed'}</div><p class="mut" style="overflow-wrap:anywhere">${esc((j.description||'').slice(0,160))}</p>${j.applied?'<span class="badge b-accepted">Applied ✓</span>':`<button class="btn h" onclick="applyJob(${Number(j.id)})">Apply</button>`}</div>`;
const jobsView=()=>{const f=S.jf||{},l=(S.jobs||[]).filter(j=>(!f.s||j.state===f.s)&&(!f.c||j.category===f.c)&&(!f.q||(j.title+' '+j.description).toLowerCase().includes(f.q.toLowerCase())));
  return `${homeHdr()}<div class="pg"><input id="q" aria-label="Search jobs" placeholder="🔍 Search jobs" value="${esc(f.q||'')}" oninput="S.jf={...S.jf,q:this.value};render(1)"><div class="pills"><select aria-label="State" onchange="S.jf={...S.jf,s:this.value};render()"><option value="">All states</option>${STATES.map(s=>`<option ${f.s===s?'selected':''}>${s}</option>`).join('')}</select><select aria-label="Skill" onchange="S.jf={...S.jf,c:this.value};render()"><option value="">Any skill</option>${CATS.map(c=>`<option ${f.c===c.name?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div>${l.length?l.map(jobCard).join(''):'<div class="card mut">No open jobs match.</div>'}${(S.apps||[]).length?'<h3>My applications</h3>'+S.apps.map(a=>`<div class="card"><b>${esc(a.title)}</b><div class="mut">${esc(a.employer_name)} · ${esc(pretty(a.status))}</div></div>`).join(''):''}</div>`};
const myJobsView=()=>`${homeHdr()}<div class="pg"><button class="btn" onclick="go('postjob')">＋ Post a job</button>${(S.myj||[]).length?S.myj.map(j=>`<div class="card"><div class="row"><b>${esc(j.title)}</b><div class="fit">${badge(j.status)}</div></div><div class="mut">${Number(j.applicants)} applicant(s)${Number(j.new_applicants)?' · '+Number(j.new_applicants)+' new':''}</div><div style="display:flex;gap:8px;margin-top:8px"><button class="btn h" onclick="S.jid=${Number(j.id)};go('applicants')">Applicants</button>${j.status==='open'?`<button class="btn h alt" onclick="closeJob(${Number(j.id)})">Close</button>`:''}</div></div>`).join(''):'<div class="card mut">You have not posted a job yet.</div>'}</div>`;
const rp=(fn,args,msg)=>run(async()=>{const{error}=await sb.rpc(fn,args);if(error)throw error;if(msg)toast(msg)}).then(()=>render());
const likeP=id=>rp('toggle_like',{p_post:id});
const delP=id=>{if(confirm('Delete this post?'))rp('delete_post',{p_post:id},'Post deleted')};
const sendCm=()=>{const t=val('cb').trim();if(t)rp('add_comment',{p_post:S.pid,p_body:t})};
const hydrateMedia=()=>document.querySelectorAll('.pm[data-path]').forEach(async el=>{const p=el.dataset.path;S.mu=S.mu||{};let u=S.mu[p];if(!u){const{data}=await sb.storage.from('post-media').createSignedUrl(p,3600);u=data&&data.signedUrl;if(u)S.mu[p]=u}if(u)el.src=u});
const savePost=()=>run(async()=>{if(!val('pk'))throw new Error('Choose a post type.');
  const fs=[...($('#pf').files||[])];if(fs.length>6)throw new Error('You can add up to 6 photos or videos.');
  for(const f of fs){const v=f.type.startsWith('video/');if(!v&&!f.type.startsWith('image/'))throw new Error('Only photos and videos can be added.');if(f.size>(v?30:8)*1024*1024)throw new Error(v?'Videos must be under 30 MB.':'Photos must be under 8 MB.')}
  if(fs.length)toast('Uploading… please wait');
  const media=[];let i=0;for(const f of fs){const path=`${S.me.id}/${Date.now()}-${i++}-${f.name.replace(/[^\w.\-]/g,'_')}`;const{error}=await sb.storage.from('post-media').upload(path,f);if(error)throw error;media.push({kind:f.type.startsWith('video/')?'video':'image',path})}
  const{error}=await sb.rpc('create_post',{p_kind:val('pk'),p_body:val('pb'),p_visibility:val('pv'),p_media:media});if(error)throw error;toast('Posted')}).then(()=>back());
const applyJob=id=>{const m=prompt('Short message to the employer (optional)');if(m===null)return;S.jobs=null;rp('apply_to_job',{p_job:id,p_message:m.trim()||null},'Application sent')};
const closeJob=id=>{if(confirm('Close this job?'))rp('close_job',{p_job:id,p_filled:false},'Job closed')};
const setApp=(id,st)=>rp('set_application_status',{p_app:id,p_status:st},'Updated');
const saveJob=()=>run(async()=>{if(!val('jt').trim()||!val('jc')||!val('js')||!val('jd').trim())throw new Error('Add a title, skill, state and description.');const{error}=await sb.rpc('create_job',{p_title:val('jt'),p_description:val('jd'),p_category_id:Number(val('jc')),p_state_id:Number(val('js')),p_lga_id:null,p_city:val('jy').trim(),p_pay_min:Number(val('jm'))||null,p_pay_max:Number(val('jx'))||null,p_requirements:val('jr').trim(),p_days:Number(val('jn'))});if(error)throw error;toast('Job posted')}).then(()=>back());
const appealV=id=>{const m=prompt('Tell the admin why this decision should be reviewed');if(m===null)return;if(!m.trim())return toast('Write your reason first.');rp('file_appeal',{p_verification_id:id,p_message:m.trim()},'Appeal sent')};
const reportP=id=>{const m=prompt('Why are you reporting this profile?');if(m===null)return;if(!m.trim())return toast('Write a reason first.');rp('file_report',{p_target:id,p_reason:'other',p_details:m.trim()},'Report sent to Verilo admins')};
const forgotPw=()=>{const e=prompt('Enter your account email');if(!e)return;run(async()=>{const{error}=await sb.auth.resetPasswordForEmail(e.trim(),{redirectTo:location.origin+location.pathname});if(error)throw error;toast('Check your email for a reset link.')})};
sb.auth.onAuthStateChange(ev=>{if(ev==='PASSWORD_RECOVERY')setTimeout(()=>{const p=prompt('Enter your new password (8+ characters)');if(!p)return;if(p.length<8)return toast('Password must be at least 8 characters.');sb.auth.updateUser({password:p}).then(r=>toast(r.error?r.error.message:'Password changed. You can log in now.'))},300)});
const BS='style="display:inline-block;width:auto;padding:8px 16px;font-size:14px"';
const bFind=()=>(S.bks||[]).find(x=>Number(x.id)===S.bid)||{};
const bAct=(fn,args,msg)=>run(async()=>{const{error}=await sb.rpc(fn,args);if(error)throw error;toast(msg)}).then(()=>render());
const acts=b=>{const o=[],B=(t,f,alt)=>o.push(`<button class="btn${alt?' alt':''}" ${BS} onclick="${f}">${t}</button> `);
  const id=Number(b.id),fin=['completed','cancelled'].includes(b.status);
  if(['accepted','negotiating'].includes(b.status))B('Propose terms',`S.bid=${id};go('terms')`,1);
  if(b.other_confirmed&&!b.i_confirmed&&['accepted','negotiating'].includes(b.status))B('Confirm terms',`bAct('confirm_booking_terms',{p_booking:${id}},'Terms confirmed')`);
  const dep=Number(b.deposit_ngn||0)-Number(b.deposit_confirmed||0),bal=Number(b.balance_ngn||0)-Number(b.balance_confirmed||0),later=['confirmed','in_progress','completed'].includes(b.status);
  if(b.my_role==='employer'){if(b.status==='awaiting_payment'&&dep>0)B('Report deposit paid',`payBook(${id},'deposit',${dep})`);if(later&&bal>0)B('Report balance paid',`payBook(${id},'balance',${bal})`)}
  else if(b.status==='awaiting_payment'||(later&&bal>0))B('Confirm payment received',`confPay(${id})`);
  if(b.status==='confirmed'&&b.my_role==='worker')B('Start work',`bAct('start_work',{p_booking:${id}},'Work started')`);
  if(b.status==='in_progress'&&!b.my_completed)B('Mark job complete',`bAct('confirm_completion',{p_booking:${id}},'Marked complete')`);
  if(b.status==='completed'&&!b.reviewed&&b.my_role==='employer')B('Leave review',`S.bid=${id};go('review')`);
  if(['accepted','negotiating','awaiting_payment','confirmed','in_progress'].includes(b.status)&&!b.pending_cancel)B('Request cancellation',`reqCancel(${id})`,1);
  if(b.pending_cancel)B('Cancellation request',`respCancel(${id})`,1);
  if(b.open_dispute)B('View dispute',`S.bid=${id};go('disputeview')`,1);
  else if(!['requested','cancelled','disputed'].includes(b.status))B('Open dispute',`S.bid=${id};go('dispute')`,1);
  if(b.conversation_id)B('Message'+(Number(b.unread)?' ('+Number(b.unread)+')':''),`openChat(${Number(b.conversation_id)})`,1);
  return o.join('')};
const bkCard=b=>`<div class="card"><div class="row"><b>${esc(b.title)}</b><div class="fit">${badge(b.status)}</div></div><div class="mut">${esc(b.other_name)} · ${esc(b.location||'')}${b.work_date?' · '+esc(b.work_date):''}</div><p style="margin:6px 0">${b.total_price_ngn!=null?ngn(b.total_price_ngn)+' total · '+ngn(b.deposit_ngn)+' deposit':'Price not agreed yet'}</p>${b.status==='awaiting_payment'?'<div class="mut">Waiting for the deposit. Verilo does not hold money: pay the worker directly.</div>':''}${b.pending_cancel?'<div class="mut">A cancellation request is pending.</div>':''}${b.open_dispute?'<div class="mut">A dispute is open with Verilo admins.</div>':''}<div style="margin-top:6px">${acts(b)}</div></div>`;
const reqCancel=id=>{const r=prompt('Why do you want to cancel? The other person must agree.');if(r===null)return;if(!r.trim())return toast('Write a reason first.');bAct('request_cancellation',{p_booking:id,p_reason:r.trim()},'Cancellation requested')};
const respCancel=id=>run(async()=>{const{data,error}=await sb.from('cancellation_requests').select('id,requested_by,reason').eq('booking_id',id).eq('status','pending').order('id',{ascending:false}).limit(1);if(error)throw error;const c=data&&data[0];if(!c)throw new Error('No pending cancellation request found.');if(c.requested_by===S.me.id)throw new Error('You asked to cancel. Waiting for the other person to respond.');const ok=confirm('Reason given: '+c.reason+'\n\nAccept the cancellation?');if(!ok&&!confirm('Decline this cancellation request?'))return;const{error:e2}=await sb.rpc('respond_cancellation',{p_id:c.id,p_accept:ok,p_note:null});if(e2)throw e2;toast(ok?'Cancellation accepted':'Cancellation declined')}).then(()=>render());
const saveDispute=()=>run(async()=>{if(!val('dr'))throw new Error('Choose a reason.');if(!val('dd').trim())throw new Error('Describe what happened.');const{error}=await sb.rpc('open_dispute',{p_booking:S.bid,p_reason:val('dr'),p_details:val('dd').trim()});if(error)throw error;toast('Dispute opened. A Verilo admin will review it.')}).then(()=>back());
const sendDisp=()=>run(async()=>{const t=val('dm').trim();if(!t)return;const{error}=await sb.rpc('add_dispute_message',{p_dispute:S.disp.id,p_body:t});if(error)throw error;toast('Sent')}).then(()=>render());
const payBook=(id,kind,amt)=>{const a=prompt('How did you pay? Type transfer, cash or other','transfer');if(a===null)return;const m={transfer:'direct_transfer',cash:'direct_cash',other:'direct_other'}[a.trim().toLowerCase()];if(!m)return toast('Type transfer, cash or other.');const ref=prompt('Payment reference (optional)');if(ref===null)return;bAct('report_booking_payment',{p_booking:id,p_kind:kind,p_amount:amt,p_paid_on:new Date().toISOString().slice(0,10),p_method:m,p_reference:ref||null,p_evidence_path:null},'Payment reported')};
const confPay=id=>run(async()=>{const{data,error}=await sb.from('booking_payments').select('id').eq('booking_id',id).eq('status','reported_paid').order('id',{ascending:false}).limit(1);if(error)throw error;if(!data.length)throw new Error('The employer has not reported a payment yet.');const{error:e2}=await sb.rpc('respond_booking_payment',{p_payment:data[0].id,p_action:'confirm',p_note:null});if(e2)throw e2;toast('Receipt confirmed')}).then(()=>render());
const saveTerms=()=>run(async()=>{const{error}=await sb.rpc('propose_booking_terms',{p_booking:S.bid,p_description:val('tn').trim(),p_total:Number(val('tp'))||0,p_deposit:Number(val('td'))||0,p_work_date:val('tw')||null,p_location:val('tl').trim(),p_method:'direct',p_cancellation_terms:val('tc').trim(),p_other_terms:val('to').trim()});if(error)throw error;toast('Terms sent')}).then(()=>back());
const saveReview=()=>run(async()=>{const b=bFind();const{error}=await sb.rpc('submit_review',{p_request:b.hiring_request_id,p_rating:Number(val('rt')),p_comment:val('rc').trim()||null});if(error)throw error;toast('Review submitted')}).then(()=>back());
const reqList=f=>{const l=f?(S.reqs||[]).filter(f):(S.reqs||[]);if(!l.length)return `<div class="card mut">${S.me.role==='worker'?'No hiring requests yet.':'You have not sent any requests yet. Find a worker to start.'}</div>`;
  return l.map(r=>`<div class="card"><div class="row"><b>${esc(r.title||'Request')}</b><div class="fit">${badge(r.status)}</div></div><p style="margin:6px 0">${esc(r.description)}</p><div class="mut">${esc(r.other_name||'')} · ${esc(r.location||'')}${r.start_date?' · starts '+esc(r.start_date):''}${r.pay_offer_ngn?' · '+ngn(r.pay_offer_ngn):''}</div>${S.me.role==='worker'&&r.status==='pending'?`<button class="btn" style="display:inline-block;width:auto;padding:8px 16px;font-size:14px" onclick="respond(${Number(r.id)},true)">Accept</button> <button class="btn alt" style="display:inline-block;width:auto;padding:8px 16px;font-size:14px" onclick="respond(${Number(r.id)},false)">Decline</button>`:''}${['pending','accepted'].includes(r.status)?`<button class="btn" style="display:inline-block;width:auto;padding:8px 16px;font-size:14px" onclick="openChat(${Number(r.conversation_id)})">Message${Number(r.unread)?' ('+Number(r.unread)+' new)':''}</button>`:''}</div>`).join('')};
const respond=(id,acc)=>run(async()=>{const{error}=await sb.rpc('respond_hire_request',{p_id:id,p_accept:acc});if(error)throw error;toast(acc?'Request accepted':'Request declined')}).then(()=>render());
const doHire=()=>run(async()=>{
  if(!val('ht').trim()||!val('hd').trim())throw new Error('Add a job title and description.');
  const{error}=await sb.rpc('send_hire_request',{p_worker:S.sel,p_title:val('ht').trim(),p_description:val('hd').trim(),p_start:val('hs')||null,p_location:val('hl').trim()||null,p_pay:Number(val('hp'))||null});
  if(error)throw error;toast('Request sent');back();
});
async function reqDelete(){if(!confirm('Request deletion of your account?'))return;const{error}=await sb.rpc('request_account_deletion');if(error)throw error;toast('Deletion request recorded')}
async function doLogout(){await sb.auth.signOut();S={me:null,screen:'welcome',hist:[],list:[],sel:null,f:{c:'All',s:'',q:''},busy:false};render()}
(async()=>{await loadMe();if(S.me)S.screen=home();render()})();
</script></body></html>
